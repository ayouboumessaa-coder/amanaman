/* aman-pro */
/* ===== AMAN professional design layer ===== */
:root{--r:16px;--sh1:0 1px 2px rgba(36,17,47,.05),0 1px 3px rgba(36,17,47,.06);--sh2:0 4px 6px -1px rgba(36,17,47,.07),0 12px 24px -6px rgba(75,23,111,.14);--ring:0 0 0 3px rgba(138,67,167,.28);--ease:cubic-bezier(.2,.7,.2,1)}
:root[data-theme="dark"],html.is-dark{--sh1:0 1px 2px rgba(0,0,0,.35);--sh2:0 10px 28px -8px rgba(0,0,0,.6);--ring:0 0 0 3px rgba(201,180,230,.35)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:16px;line-height:1.7}
main{max-width:1120px;padding:28px 20px 40px}
h1,h2,h3{letter-spacing:-.01em;font-weight:800}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0}
h2{font-size:clamp(1.35rem,3.2vw,1.75rem);margin:36px 0 14px}
main>h2:first-child,main>section+h2{margin-top:8px}
h2::after{width:44px;height:4px;margin-top:10px;border-radius:99px;background:linear-gradient(90deg,var(--g),#f7cf73)}
h3{font-size:1.08rem}
p{color:inherit}
/* Header */
header{background:linear-gradient(180deg,#52197a 0%,var(--p) 100%);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 6px 20px -10px rgba(36,10,56,.55);padding:10px 20px;min-height:64px}
.logo{letter-spacing:.06em;font-size:1.15rem}
.lc{box-shadow:0 0 0 2px rgba(244,185,66,.9),0 4px 10px rgba(0,0,0,.18)}
.dn{gap:2px}.dn a{padding:8px 12px;border-radius:10px;font-weight:600;font-size:.88rem;opacity:.88;transition:background .2s,opacity .2s}
.dn a:hover{opacity:1;background:rgba(255,255,255,.1)}
.dn a.on{opacity:1;background:rgba(255,255,255,.16);box-shadow:inset 0 -2px 0 var(--g)}
#lg{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:6px 10px;font-weight:600;cursor:pointer}
#lg option{color:#24112f;background:#fff}
.bg{border-color:rgba(255,255,255,.35);border-radius:10px;padding:6px 10px;background:rgba(255,255,255,.08)}
.theme-btn,.a11y-hbtn{transition:background .2s,transform .2s}
.btn-sos{box-shadow:0 4px 14px -4px rgba(217,4,41,.6);padding:7px 16px;border:0}
/* Hero */
.hero{border-radius:28px;padding:clamp(32px,6vw,64px) clamp(22px,5vw,56px) clamp(56px,7vw,80px);background:radial-gradient(120% 140% at 100% 0%,rgba(244,185,66,.22) 0%,rgba(244,185,66,0) 42%),radial-gradient(90% 120% at 0% 100%,rgba(201,180,230,.35) 0%,rgba(201,180,230,0) 55%),linear-gradient(135deg,#3f1260 0%,var(--p) 45%,var(--s) 100%);box-shadow:0 8px 40px -8px rgba(75,23,111,.6),var(--sh2);isolation:isolate}
.hero::after{opacity:.08;font-size:13rem}
.hero::before{opacity:.22}
.hero h1{font-size:clamp(1.9rem,5.2vw,3.1rem);line-height:1.15;margin-bottom:.4em;text-wrap:balance}
.hero p{font-size:clamp(1rem,1.6vw,1.12rem);line-height:1.75;opacity:.92;text-wrap:pretty}
.hl{height:104px;width:104px;padding:8px;box-shadow:0 0 0 3px var(--g),0 12px 30px -8px rgba(0,0,0,.4)}
.hero .btn{margin-top:10px}
.hero .btn.o{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(4px)}
.hero .btn.o:hover{background:rgba(255,255,255,.18)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 24px;border-radius:999px;font-weight:700;font-size:.95rem;letter-spacing:.01em;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px -4px rgba(244,185,66,.5);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.1),0 12px 24px -6px rgba(244,185,66,.6)}
.btn:active{transform:translateY(0);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn.d{background:linear-gradient(135deg,#4B176F,#6E269B);box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 18px -6px rgba(75,23,111,.6)}
.btn.d:hover{background:linear-gradient(135deg,#5c1f86,#7e30b0);box-shadow:0 2px 4px rgba(0,0,0,.12),0 12px 24px -6px rgba(75,23,111,.7)}
.btn.o{box-shadow:none;border-width:1.5px}
.btn.o:hover{background:rgba(138,67,167,.1);border-color:var(--s)}
/* Cards */
.grid{gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:16px 0 34px}
.card{border-radius:var(--r);padding:22px;box-shadow:var(--sh1);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;position:relative;border:1px solid var(--bd)}
a.card{display:block}
a.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px -8px rgba(75,23,111,.18),var(--sh2);border-color:rgba(138,67,167,.4)}
a.card::after{content:"";position:absolute;inset-inline-end:20px;top:24px;width:8px;height:8px;border-top:2px solid var(--mu);border-inline-end:2px solid var(--mu);transform:rotate(45deg);opacity:0;transition:opacity .25s,inset-inline-end .25s}
html[dir=rtl] a.card::after{transform:rotate(-135deg)}
a.card:hover::after{opacity:.7;inset-inline-end:16px}
.card h3{margin-bottom:6px;color:var(--tx);font-size:1.05rem}
.card p{line-height:1.65;font-size:.94rem}
.card .ic{width:44px;height:44px;padding:10px;border-radius:12px;background:rgba(138,67,167,.1);color:var(--ic);margin-bottom:14px;box-sizing:border-box}
.note{border-inline-start-width:4px;border-radius:12px;padding:14px 18px;box-shadow:var(--sh1);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);border-inline-end:1px solid var(--bd)}
.em{border-width:1.5px;border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh1)}
.tag{font-weight:600;padding:3px 10px}
/* Forms */
label{font-size:.88rem;margin:14px 0 6px;color:var(--tx)}
form input:not([type=checkbox]),form textarea,form select,.bar input,.bar select{min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);transition:border-color .2s,box-shadow .2s}
form input:not([type=checkbox]):focus,form textarea:focus,form select:focus,.bar input:focus,.bar select:focus{outline:none;border-color:var(--s);box-shadow:var(--ring)}
.bar{gap:10px;margin:14px 0 18px}
table{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;border-collapse:separate;border-spacing:0;background:var(--card)}
td,th{padding:12px 14px}tr:last-child td{border-bottom:0}tr:hover td{background:rgba(138,67,167,.04)}
/* Bottom bar (mobile) */

.ai-msg-actions{gap:10px;padding-top:12px;margin-top:12px;border-top:1px solid var(--bd)}
.ai-action-btn{min-height:36px}.ai-form{gap:8px;padding:12px;border-top:1px solid var(--bd)}
#ai-input{min-width:0;line-height:1.7;padding:10px 8px}
.ai-icon-btn,.ai-send{flex-shrink:0;min-width:42px;min-height:42px}
.ai-send:disabled{opacity:.45;cursor:wait}
.reply-lang{flex-wrap:wrap;gap:8px;margin-top:18px}.reply-lang select{max-width:100%;min-height:42px}
.ai-disclaimer{line-height:1.75;margin-top:14px}
.voice-heard{overflow-wrap:anywhere;max-height:22vh;overflow-y:auto}
@media(max-width:540px){.ai-top{flex-wrap:wrap}.ai-top-txt{flex:1}.ai-top-act{margin-inline-start:auto}.ai-voice-cta{padding:16px 12px}.ai-msg-avatar{display:none}#ai-chat-box{padding:16px 12px}.ai-msg-bubble{max-width:94%}.ai-form{gap:4px;padding:8px}.ai-form .ai-icon-btn,.ai-send{min-width:36px;width:36px}.ai-audio-tools{gap:8px 10px}.reply-lang select{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.voice-answer{max-height:22vh;overflow-y:auto;white-space:pre-wrap;line-height:1.8;text-align:start;overflow-wrap:anywhere;font-size:.95rem}.voice-answer:empty{display:none}
/* Useful numbers: purple tiles with large gold numbers */
.em.nums{background:linear-gradient(135deg,#1a0929 0%,#24112f 50%,#2a1038 100%);border:1.5px solid rgba(91,42,134,.7);border-radius:24px;padding:24px 24px 20px;color:#f3eaf8;box-shadow:var(--sh2),0 0 0 1px rgba(244,185,66,.08);position:relative;overflow:hidden}
.em.nums::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top right,rgba(244,185,66,.08) 0%,transparent 60%);pointer-events:none}
.em.nums h3{color:#fff;font-size:1.3rem;font-weight:800;margin:0 0 18px;position:relative}
.num-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.num-t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:122px;padding:16px 8px;border-radius:22px;background:linear-gradient(160deg,#5c2385 0%,#4B176F 60%,#360d52 100%);color:#fff;text-decoration:none;text-align:center;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s;box-shadow:0 4px 16px -4px rgba(75,23,111,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.num-t:hover{background:linear-gradient(160deg,#7a30a8 0%,#5c1f86 60%,#4a1070 100%);transform:translateY(-3px) scale(1.02);box-shadow:0 8px 24px -4px rgba(75,23,111,.8),0 0 0 1px rgba(244,185,66,.3),inset 0 1px 0 rgba(255,255,255,.18)}
.num-t:active{transform:translateY(0) scale(.99)}
.num-t:focus-visible{outline:3px solid #F4B942;outline-offset:3px}
.num-t b{font-family:Montserrat,Tajawal,sans-serif;font-size:2.5rem;font-weight:800;line-height:1;color:#F4B942;text-shadow:0 0 20px rgba(244,185,66,.4)}
.num-t span{font-size:.93rem;font-weight:600;color:#e8d5f8;letter-spacing:.01em}
.num-n{margin:16px 0 0;font-size:.95rem;line-height:1.9;color:#c3b0d2}
@media(max-width:420px){.num-g{gap:10px}.num-t{min-height:100px;border-radius:16px}.num-t b{font-size:1.9rem}.num-t span{font-size:.85rem}}
html.a11y-dark .em.nums,html.a11y-dark .num-t{background:#000;border:2px solid #ffe14d}
html.a11y-dark .num-t b,html.a11y-dark .num-t span,html.a11y-dark .num-n{color:#ffe14d}
html.a11y-contrast .em.nums{background:#fff;color:#000;border-color:#000}
html.a11y-contrast .em.nums h3,html.a11y-contrast .num-n{color:#000}
html.a11y-contrast .num-t{background:#2a0040}

/* ── Guide step cards ── */
.steps-list{display:flex;flex-direction:column;gap:14px;margin:16px 0 28px}
.step-card{display:flex;gap:16px;padding:18px 20px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh1);transition:box-shadow .2s}
.step-card:hover{box-shadow:var(--sh2)}
.step-num{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#4B176F,#8A43A7);color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step-body{flex:1}.step-body h3{margin:0 0 6px;font-size:1rem;font-weight:700;color:var(--tx)}.step-body p{margin:0;font-size:.93rem;line-height:1.65;color:var(--mu)}
/* ── Phone icon inside num-t ── */
.num-ic{color:rgba(255,255,255,.55);flex-shrink:0;transition:color .15s}
.num-t:hover .num-ic{color:rgba(255,255,255,.85)}
/* ── Quiz ok badge ── */
.quiz-ok{display:inline-flex;align-items:center;gap:5px;color:#22c55e;font-weight:700}
/* ── Contact page ── */
.ct-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:16px 0 28px}
.social-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.social-link{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:rgba(138,67,167,.1);color:var(--tx);font-size:.88rem;font-weight:600;text-decoration:none;transition:background .2s,transform .15s;border:1px solid var(--bd)}
.social-link:hover{background:rgba(138,67,167,.22);transform:translateY(-1px)}
.social-link svg{flex-shrink:0;color:var(--ac)}

/* ========================================================
   AMAN SOLIDARITY & INCLUSION STUDIO (فضاء التضامن والاستشارة)
   Modes: Chat & Dictation, Video Sign Language, Blind Audio
   ======================================================== */

/* Accessibility Mode Tabs */
.ai-mode-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:12px 0 16px;scrollbar-width:none}
.ai-mode-tabs::-webkit-scrollbar{display:none}
.ai-mode-tab{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--card);border:1.5px solid var(--bd);color:var(--tx);font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.ai-mode-tab:hover{border-color:var(--p);background:rgba(75,23,111,0.05);transform:translateY(-1px)}
.ai-mode-tab.on{background:linear-gradient(135deg,var(--p),#6E269B);color:#fff;border-color:var(--p);box-shadow:0 4px 14px rgba(75,23,111,0.35)}
.ai-mode-tab.on svg{color:#F4B942}

/* Live Voice-to-Text Dictation Banner */
.ai-dictation-banner{margin-bottom:14px;background:rgba(244,185,66,0.08);border:1.5px dashed rgba(244,185,66,0.6);border-radius:18px;padding:14px}
.ai-dictate-btn{width:100%;min-height:52px;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#4B176F,#6E269B);box-shadow:0 4px 16px rgba(75,23,111,0.25)}
.ai-dictate-btn.dictating{background:#ef233c!important;animation:pulseDictate 1.2s infinite alternate}
@keyframes pulseDictate{from{box-shadow:0 0 0 0 rgba(239,35,60,0.7)}to{box-shadow:0 0 0 12px rgba(239,35,60,0)}}

/* Video Sign Language Studio (للصم والبكم) */
.ai-sign-container{margin-bottom:24px}
.ai-video-box{position:relative;width:100%;height:380px;background:#050109;border-radius:24px;overflow:hidden;border:2.5px solid var(--p);box-shadow:var(--sh2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ai-video-box.camera-live{border-color:#10b981!important;box-shadow:0 0 30px rgba(16,185,129,0.4)!important}
#ai-sign-video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
#ai-sign-video.mirrored{transform:scaleX(-1)}
.ai-sign-hud-canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none}
.ai-video-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px;z-index:3}

/* Start Camera Prompt (When Camera Idle) */
.ai-cam-start-prompt{position:absolute;inset:0;background:rgba(12,4,20,0.85);backdrop-filter:blur(6px);z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;cursor:pointer;transition:background 0.2s}
.ai-cam-start-prompt:hover{background:rgba(12,4,20,0.92)}
.ai-cam-start-icon{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--p),#9333ea);color:#F4B942;display:grid;place-items:center;box-shadow:0 0 25px rgba(244,185,66,0.35);animation:amanPulseDot 1.4s infinite alternate}
.ai-cam-start-prompt b{color:#fff;font-size:1.15rem;font-weight:800}
.ai-cam-start-prompt small{color:rgba(255,255,255,0.7);font-size:0.85rem}

/* Reticle & Scan line */
.ai-sign-reticle{position:relative;width:220px;height:220px;margin-top:20px;border-radius:24px;background:rgba(0,0,0,0.06)}
.ai-reticle-corner{position:absolute;width:22px;height:22px;border:3px solid #F4B942}
.ai-reticle-corner.tl{top:0;left:0;border-right:none;border-bottom:none;border-top-left-radius:12px}
.ai-reticle-corner.tr{top:0;right:0;border-left:none;border-bottom:none;border-top-right-radius:12px}
.ai-reticle-corner.bl{bottom:0;left:0;border-right:none;border-top:none;border-bottom-left-radius:12px}
.ai-reticle-corner.br{bottom:0;right:0;border-left:none;border-top:none;border-bottom-right-radius:12px}

/* HUD Badges */
.ai-hud-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:auto}
.ai-hud-badge{background:rgba(18,7,28,0.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);padding:5px 14px;border-radius:999px;color:#fff;font-size:0.82rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ai-hud-badge.sign-tag{border-color:#F4B942;color:#F4B942;box-shadow:0 0 10px rgba(244,185,66,0.25)}

.ai-video-status{background:rgba(18,7,28,0.9);backdrop-filter:blur(8px);color:#fff;font-size:.84rem;font-weight:700;padding:6px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.25);display:inline-flex;align-items:center;gap:6px;margin-top:8px}
.ai-live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;margin-inline-end:6px;vertical-align:middle;animation:amanPulseDot 1s infinite alternate}
@keyframes amanPulseDot{from{transform:scale(0.85);opacity:0.7}to{transform:scale(1.2);opacity:1}}

/* Controls & Device Row */
.ai-sign-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.ai-sign-translate-btn{flex:2;min-height:50px;font-size:1.02rem;font-weight:800;background:linear-gradient(135deg,var(--p),#7E22CE)!important;box-shadow:0 6px 18px rgba(75,23,111,0.35)}
.ai-sos-silent-btn{border-color:#dc2626!important;color:#dc2626!important;font-weight:800!important}
.ai-sos-silent-btn:hover{background:#dc2626!important;color:#fff!important}
.ai-cam-device-row{margin:-4px 0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-cam-select{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 14px;font-size:.86rem;font-weight:700;cursor:pointer;outline:none}

/* Universal Signal for Help 3-Step Illustrated Guide */
.ai-sign-help-guide{background:linear-gradient(135deg,rgba(239,35,60,0.06),rgba(244,185,66,0.08));border:1.5px solid rgba(239,35,60,0.3);border-radius:20px;padding:16px 18px;margin-bottom:18px}
.ai-sign-guide-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--tx)}
.ai-sign-guide-head svg{color:#dc2626}
.ai-sign-guide-head b{font-size:.96rem;font-weight:800}
.ai-sign-steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ai-sign-step{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;position:relative}
.ai-step-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#dc2626;color:#fff;font-size:.78rem;font-weight:900;margin-bottom:6px}
.ai-sign-step b{display:block;font-size:.88rem;color:var(--tx);margin-bottom:3px}
.ai-sign-step p{margin:0;font-size:.8rem;color:var(--mu);line-height:1.45}

/* Sign Cards */
.ai-sign-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:18px}
.ai-sign-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:.88rem;text-align:start;cursor:pointer;transition:all .18s var(--ease)}
.ai-sign-card:hover{border-color:var(--p);background:rgba(75,23,111,0.06);transform:translateY(-2px);box-shadow:var(--sh1)}
.ai-sign-card.active-sign{border-color:#F4B942!important;background:rgba(244,185,66,0.12)!important;box-shadow:0 0 16px rgba(244,185,66,0.3)!important}
.ai-sign-card-icon{width:36px;height:36px;border-radius:10px;background:rgba(75,23,111,0.08);color:var(--ac);display:grid;place-items:center;flex-shrink:0}
.ai-sign-card.active-sign .ai-sign-card-icon{background:#F4B942;color:#1e1b4b}
.ai-sign-response-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(75,23,111,0.06);border-radius:12px;margin-bottom:10px;color:var(--ac);font-size:.9rem}

/* =========================================================
   BLIND & VISUALLY IMPAIRED ACCESSIBILITY SPACE (للمكفوفات)
   ========================================================= */
.ai-blind-container{margin-bottom:24px}
.ai-blind-card{border:2.5px solid var(--g);background:var(--card);border-radius:26px;padding:24px;box-shadow:var(--sh2)}
.ai-blind-header{display:flex;align-items:center;gap:16px;margin-bottom:18px}

.ai-blind-mic-wrapper{margin:16px 0}
.ai-giant-voice-btn{width:100%;min-height:120px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#380E54,#5B1B8A);box-shadow:0 10px 28px rgba(75,23,111,0.4);border:3px solid #F4B942;color:#fff;cursor:pointer;padding:18px;transition:all .22s ease}
.ai-giant-voice-btn:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(75,23,111,0.5);border-color:#fff}
.ai-giant-voice-btn.listening{background:linear-gradient(135deg,#dc2626,#991b1b)!important;border-color:#fff!important;animation:amanPulseRed 1.2s infinite ease-in-out;box-shadow:0 0 0 8px rgba(220,38,38,0.3)!important}
.ai-blind-mic-icon{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.15);display:grid;place-items:center;color:#F4B942}
.ai-giant-voice-btn.listening .ai-blind-mic-icon{background:rgba(255,255,255,0.25);color:#fff}
.ai-blind-status-label{font-size:1.22rem;font-weight:900;text-align:center;line-height:1.4}

/* Audio Waves Animation */
.ai-blind-waves{display:flex;align-items:center;gap:6px;height:24px;opacity:0.3;transition:opacity 0.2s}
.ai-blind-waves.active{opacity:1}
.ai-blind-waves span{display:inline-block;width:6px;height:100%;background:#F4B942;border-radius:999px;animation:blindWave 1s infinite ease-in-out}
.ai-blind-waves.active span:nth-child(1){animation-delay:0.1s}
.ai-blind-waves.active span:nth-child(2){animation-delay:0.25s}
.ai-blind-waves.active span:nth-child(3){animation-delay:0.4s}
.ai-blind-waves.active span:nth-child(4){animation-delay:0.25s}
.ai-blind-waves.active span:nth-child(5){animation-delay:0.1s}
@keyframes blindWave{0%,100%{transform:scaleY(0.25)}50%{transform:scaleY(1)}}

/* High Contrast Spoken Transcript Box */
.ai-blind-transcript-box{background:rgba(75,23,111,0.08);border:2px solid var(--p);border-radius:20px;padding:16px 18px;margin-bottom:18px}
html.is-dark .ai-blind-transcript-box{background:rgba(75,23,111,0.3);border-color:#c084fc}
.ai-blind-transcript-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:var(--tx);font-size:.9rem}
.ai-blind-dialect-badge{background:var(--card);border:1px solid var(--bd);padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;color:var(--mu)}
.ai-blind-transcript-text{font-size:1.15rem;font-weight:800;color:var(--tx);line-height:1.7;min-height:54px;padding:8px 0;word-break:break-word}
.ai-blind-transcript-text.has-content{color:#F4B942}
html:not(.is-dark) .ai-blind-transcript-text.has-content{color:#4B176F}
.ai-blind-transcript-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--bd);padding-top:12px}

/* Audio Action Bar & Quick Prompts */
.ai-blind-audio-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ai-blind-tool-btn{flex:1;min-height:48px;font-size:.94rem;font-weight:800}
.ai-blind-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ai-blind-quick-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:.96rem;cursor:pointer;text-align:start;transition:all .2s ease}
.ai-blind-quick-card:hover{border-color:#F4B942;background:rgba(244,185,66,0.1);transform:translateY(-2px);box-shadow:var(--sh1)}
.ai-blind-quick-icon{width:42px;height:42px;border-radius:12px;background:rgba(244,185,66,0.15);color:#d97706;display:grid;place-items:center;flex-shrink:0}

/* ==========================================================================
   AMAN Universal PWA & Multi-Device Adaptation Engine
   ========================================================================== */

/* Header Install Button */
.btn-pwa-install {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(244, 185, 66, 0.16);
  color: #f59e0b;
  border: 1.5px solid rgba(244, 185, 66, 0.45);
  border-radius: 11px;
  padding: 6px 12px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  min-height: 38px;
}
html.is-dark .btn-pwa-install {
  background: rgba(244, 185, 66, 0.12);
  color: #F4B942;
  border-color: rgba(244, 185, 66, 0.35);
}
.btn-pwa-install:hover {
  background: rgba(244, 185, 66, 0.28);
  border-color: #F4B942;
  transform: translateY(-1px);
}
.btn-pwa-install .ic {
  width: 17px;
  height: 17px;
  margin: 0;
}
.btn-pwa-install.is-standalone {
  background: rgba(42, 157, 143, 0.12);
  color: #2a9d8f;
  border-color: rgba(42, 157, 143, 0.35);
}
@media (max-width: 580px) {
  .btn-pwa-install {
    padding: 6px 9px;
  }
}
@media (max-width: 440px) {
  .btn-pwa-install {
    width: 36px;
    height: 36px;
    padding: 0;
    justify-content: center;
    border-radius: 10px;
  }
  .btn-pwa-install .pwa-txt {
    display: none;
  }
}

/* Toast Notifications */
.aman-toast {
  position: fixed;
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  inset-inline-start: 50%;
  transform: translateX(50%) translateY(30px);
  background: #1e1029;
  color: #fff;
  border: 1px solid rgba(244, 185, 66, 0.4);
  border-radius: 14px;
  padding: 12px 20px;
  font-size: 0.94rem;
  font-weight: 700;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
  z-index: 100005;
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 90vw;
  text-align: center;
}
[dir="rtl"] .aman-toast {
  transform: translateX(50%) translateY(30px);
}
[dir="ltr"] .aman-toast {
  transform: translateX(-50%) translateY(30px);
}
.aman-toast.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(50%) translateY(0);
}
[dir="ltr"] .aman-toast.show {
  transform: translateX(-50%) translateY(0);
}
.aman-toast-success {
  border-color: #2a9d8f;
  background: #0f2d27;
  color: #6ee7b7;
}

/* Drawer Menu Install Tile */
.drw-install-box {
  margin: 12px 0 16px;
  padding: 0;
}
.drw-install-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(244, 185, 66, 0.14);
  color: var(--tx);
  border: 1.5px solid rgba(244, 185, 66, 0.4);
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 0.98rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s ease;
}
.drw-install-btn:hover {

/* ==========================================================================
   ENHANCED MOBILE DRAWER & NAVIGATION (#drw)
   ========================================================================== */
#drw.drw-container {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  overflow: hidden;
}
.drw-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(18, 9, 25, 0.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: drwFadeIn .2s ease;
}
.drw-drawer-panel {
  position: absolute;
  top: 0;
  bottom: 0;
  inset-inline-start: 0;
  width: min(85vw, 360px);
  background: var(--card);
  color: var(--tx);
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.35);
  display: flex;
  flex-direction: column;
  z-index: 1001;
  animation: drwSlideIn .25s ease-out;
}
@keyframes drwFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes drwSlideIn {
  from { transform: translateX(calc(-100% * var(--dir-sign, 1))); }
  to { transform: translateX(0); }
}
html[dir=rtl] {
  --dir-sign: -1;
}
html[dir=ltr] {
  --dir-sign: 1;
}

/* === FILE: community.css === */
/* AMAN Community · Facebook-style Layout & Comprehensive Day/Night Mode */

/* Header & Theme button fix: Ensure theme button is ALWAYS visible on all screen sizes */
header {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 10px;
  min-height: 62px;
  padding: 8px clamp(12px, 3vw, 24px);
  background: linear-gradient(180deg, var(--p) 0%, #380e54 100%);
  border-bottom: 1px solid var(--bd);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
}

header #theme-btn {
  display: inline-flex !important;
  visibility: visible !important;
  opacity: 1 !important;
}

/* Ensure theme button is always prominent */
.theme-btn {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.35);
  cursor: pointer;
  transition: all 0.2s ease;
}
.theme-btn:hover {
  background: rgba(255, 255, 255, 0.28);
  transform: scale(1.05);
}
.theme-btn .moon { display: none; }
html.is-dark .theme-btn .sun { display: none; }
html.is-dark .theme-btn .moon { display: block; }

/* Vector SVG Icon Rules */
.fb-svg {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}
.fb-user-avatar .fb-svg,
.fb-post-avatar .fb-svg,
.fb-comment-avatar .fb-svg {
  width: 22px;
  height: 22px;
}
.fb-action-pill .fb-svg {
  color: var(--ac);
}
.fb-btn-action .fb-svg {
  color: var(--mu);
}
.fb-btn-action.liked .fb-svg {
  color: #0866FF;
}
html.is-dark .fb-btn-action.liked .fb-svg {
  color: #38bdf8;
}
.fb-badge .fb-svg {
  vertical-align: -2px;
  margin-inline-end: 4px;
}
.fb-search-inner {
  display: flex;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 0 14px;
}
.fb-search-ic {
  display: grid;
  place-items: center;
  color: var(--mu);
  margin-inline-end: 8px;
}
.fb-search-inner input {
  border: none;
  background: transparent;
  padding: 11px 0;
  width: 100%;
  outline: none;
  color: var(--tx);
  font: inherit;
  font-size: 0.92rem;
}

/* Modern Toggle Switch */
.fb-toggle {
  position: relative;
  display: inline-block;
  width: 48px;
  height: 26px;
  flex-shrink: 0;

.fb-toggle input {
  opacity: 0;
  width: 0;
  height: 0;

.fb-toggle-slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #cbd5e1;
  transition: 0.25s;
  border-radius: 34px;
}
.fb-toggle-slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: 0.25s;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.fb-toggle input:checked + .fb-toggle-slider {
  background-color: #7B2CBF;
}

  transform: translateX(22px);
}

        ["- لا تدفعي أي مبلغ ولا ترسلي صوراً أخرى: الدفع لا يوقف الابتزاز غالباً بل يزيده.", "- لا تحذفي المحادثات: التقطي صوراً للشاشة تظهر اسم الحساب والرابط والتاريخ، واحفظي نسخة في مكان آمن.", "- أوقفي الرد على المبتز ثم احظري الحساب بعد حفظ الأدلة.", "- بلّغي المنصة (فيسبوك، إنستغرام، تيك توك، واتساب) عن الحساب والمحتوى.", "- قدّمي شكاية لدى النيابة العامة أو الشرطة أو الدرك. الشرطة لديها مصالح مختصة في الجريمة الإلكترونية.", "- القانون الجنائي (الفصول 447-1 إلى 447-3 المضافة بالقانون 103-13) يعاقب على التقاط أو نشر الصور والأقوال الخاصة دون موافقة، وعلى التركيب والادعاءات الكاذبة للمس بالحياة الخاصة.", "يمكنك أن تطلبي من مساعد أمان تحليل لقطات الشاشة وشرح الخطوات المقبلة."],
        ["- Ne payez rien et n'envoyez pas d'autres images : payer n'arrête généralement pas le chantage, au contraire.", "- Ne supprimez pas les conversations : faites des captures montrant le nom du compte, le lien et la date, et gardez une copie en lieu sûr.", "- Cessez de répondre puis bloquez le compte après avoir sauvegardé les preuves.", "- Signalez le compte et le contenu à la plateforme (Facebook, Instagram, TikTok, WhatsApp).", "- Déposez plainte auprès du parquet, de la police ou de la gendarmerie. La police dispose de services spécialisés en cybercriminalité.", "- Le Code pénal (articles 447-1 à 447-3 ajoutés par la loi 103-13) punit la captation ou la diffusion d'images et de paroles privées sans consentement, ainsi que les montages et fausses allégations portant atteinte à la vie privée.", "Vous pouvez demander à l'assistant AMAN d'analyser vos captures d'écran et d'expliquer les prochaines étapes."],
        ["- Do not pay and do not send more images: paying usually does not stop blackmail, it makes it worse.", "- Do not delete the conversations: take screenshots showing the account name, link and date, and keep a copy somewhere safe.", "- Stop replying, then block the account after saving the evidence.", "- Report the account and content to the platform (Facebook, Instagram, TikTok, WhatsApp).", "- File a complaint with the Public Prosecutor, the police or the gendarmerie. The police have units specialised in cybercrime.", "- The Penal Code (articles 447-1 to 447-3, added by Law 103-13) punishes capturing or sharing private images and words without consent, and fake montages or allegations that harm private life.", "You can ask the AMAN assistant to analyse your screenshots and explain the next steps."]
      ] },
    { id: "phone", cat: "digital",
      t: ["تأمين الهاتف والحسابات", "Sécuriser son téléphone et ses comptes", "Securing your phone and accounts"],
      s: ["خطوات بسيطة تحمي رسائلك وصورك وموقعك من التجسس.", "Des gestes simples pour protéger vos messages, photos et position contre l'espionnage.", "Simple steps to protect your messages, photos and location from spying."],
      b: [
        ["- غيّري كلمة سر الهاتف وكلمات سر البريد وفيسبوك وواتساب، واجعليها مختلفة وطويلة.", "- فعّلي التحقق بخطوتين في البريد الإلكتروني وشبكات التواصل.", "- راجعي الأجهزة المتصلة بحساباتك (واتساب ويب، فيسبوك، Google) واقطعي ما لا تعرفينه.", "- أوقفي مشاركة الموقع في خرائط Google وسناب شات وغيرها.", "- راجعي التطبيقات المثبتة: تطبيق غريب يستهلك البطارية أو يطلب أذونات كثيرة قد يكون تطبيق تجسس.", "- لا تتركي الهاتف مفتوحاً، واحذري من الروابط والملفات المجهولة.", "انتبهي: إذا كان الشخص المعتدي يراقبك، فتغيير كل شيء دفعة واحدة قد ينبهه. خططي لذلك بهدوء ومع جهة مختصة إن أمكن."],
        ["- Changez le code du téléphone et les mots de passe de l'e-mail, Facebook et WhatsApp : longs et différents.", "- Activez la validation en deux étapes sur l'e-mail et les réseaux sociaux.", "- Vérifiez les appareils connectés à vos comptes (WhatsApp Web, Facebook, Google) et déconnectez ceux que vous ne reconnaissez pas.", "- Désactivez le partage de position (Google Maps, Snapchat…).", "- Vérifiez les applications installées : une application inconnue qui vide la batterie ou demande beaucoup d'autorisations peut être un logiciel espion.", "- Ne laissez pas votre téléphone déverrouillé et méfiez-vous des liens et fichiers inconnus.", "Attention : si l'agresseur vous surveille, tout changer d'un coup peut l'alerter. Planifiez calmement, si possible avec une structure spécialisée."],
        ["- Change your phone passcode and your email, Facebook and WhatsApp passwords: long and different.", "- Turn on two-step verification for email and social media.", "- Check devices connected to your accounts (WhatsApp Web, Facebook, Google) and log out any you don't recognise.", "- Turn off location sharing (Google Maps, Snapchat, etc.).", "- Check installed apps: an unknown app that drains the battery or asks for many permissions may be spyware.", "- Don't leave your phone unlocked and be careful with unknown links and files.", "Careful: if the abuser monitors you, changing everything at once may alert them. Plan calmly, with a specialised service if possible."]
      ] },
    { id: "plan", cat: "safety",
      t: ["خطة السلامة الشخصية", "Le plan de sécurité personnel", "Your personal safety plan"],
      s: ["التحضير المسبق يساعدك على التصرف بسرعة إذا ساءت الأمور.", "Se préparer à l'avance aide à agir vite si la situation s'aggrave.", "Preparing in advance helps you act quickly if things get worse."],
      b: [
        ["- احفظي أرقام 19 و177 و8350 ورقم شخص ثقة، ويمكنك حفظ رقم الثقة في زر SOS داخل التطبيق.", "- اتفقي مع شخص ثقة على كلمة سر تعني «اتصل بالشرطة» أو «تعال حالاً».", "- جهزي حقيبة صغيرة عند شخص تثقين به: نسخ البطاقة الوطنية ودفتر الحالة المدنية وعقد الزواج وشواهد الأطفال، أدوية، مال قليل، شاحن.", "- حددي مكاناً آمناً يمكنك الذهاب إليه (عائلة، صديقة، جمعية).", "- في لحظة الخطر ابتعدي عن المطبخ والأماكن التي فيها أدوات حادة، واقتربي من باب الخروج.", "- إذا كان معك أطفال، علميهم كيف يتصلون بـ19 أو بأحد الجيران.", "أمان ليست خدمة طوارئ. في خطر مباشر اتصلي فوراً بـ19 (المدن) أو 177 (القرى)."],
        ["- Enregistrez le 19, le 177, le 8350 et le numéro d'une personne de confiance (vous pouvez l'enregistrer dans le bouton SOS de l'application).", "- Convenez avec une personne de confiance d'un mot code qui signifie « appelle la police » ou « viens tout de suite ».", "- Préparez un petit sac chez une personne de confiance : copies de la CIN, du livret de famille, de l'acte de mariage et des documents des enfants, médicaments, un peu d'argent, un chargeur.", "- Identifiez un lieu sûr où aller (famille, amie, association).", "- En cas de danger, éloignez-vous de la cuisine et des objets tranchants, rapprochez-vous d'une sortie.", "- Si vous avez des enfants, apprenez-leur à appeler le 19 ou un voisin.", "AMAN n'est pas un service d'urgence. En danger immédiat, appelez le 19 (ville) ou le 177 (zone rurale)."],
        ["- Save 19, 177, 8350 and a trusted person's number (you can store it in the app's SOS button).", "- Agree on a code word with a trusted person meaning \"call the police\" or \"come now\".", "- Leave a small bag with someone you trust: copies of your ID card, family record book, marriage certificate and children's papers, medicine, some money, a charger.", "- Identify a safe place to go (family, friend, association).", "- In danger, move away from the kitchen and sharp objects, and stay close to an exit.", "- If you have children, teach them to call 19 or a neighbour.", "AMAN is not an emergency service. In immediate danger call 19 (cities) or 177 (rural areas)."]
      ] },
    { id: "evidence", cat: "rights",
      t: ["كيف أوثق ما يحدث بأمان", "Documenter les faits en sécurité", "How to document what happens, safely"],
      s: ["الأدلة تقوي الشكاية، لكن سلامتك أهم من أي دليل.", "Les preuves renforcent une plainte, mais votre sécurité passe avant tout.", "Evidence strengthens a complaint, but your safety comes first."],
      b: [
        ["- الشهادة الطبية: بعد أي اعتداء جسدي اذهبي إلى المستشفى أو طبيب واطلبي شهادة طبية تحدد مدة العجز. خلايا التكفل بالمستشفيات تستقبل النساء ضحايا العنف.", "- الصور: صوري الإصابات والأضرار مع التاريخ، واحتفظي بالأصل دون تعديل.", "- الرسائل: لقطات شاشة كاملة تظهر الاسم والرقم والتاريخ، ولا تحذفي المحادثة الأصلية.", "- الشهود: دوّني أسماء من رأى أو سمع ما وقع إن كان ذلك آمناً.", "- مذكرة شخصية: تواريخ الوقائع وأماكنها باختصار، في مكان لا يصل إليه المعتدي (بريد خاص أو عند شخص ثقة).", "لا تخاطري بسلامتك لجمع دليل. يمكن تقديم الشكاية حتى بدون أدلة كثيرة، والنيابة العامة هي التي تأمر بالبحث."],
        ["- Certificat médical : après toute agression physique, allez à l'hôpital ou chez un médecin et demandez un certificat indiquant la durée d'incapacité. Les cellules de prise en charge des hôpitaux accueillent les femmes victimes.", "- Photos : photographiez les blessures et dégâts avec la date, gardez l'original sans retouche.", "- Messages : captures d'écran complètes avec le nom, le numéro et la date ; ne supprimez pas la conversation d'origine.", "- Témoins : notez les noms des personnes qui ont vu ou entendu, si c'est sans danger.", "- Journal : dates et lieux des faits en bref, dans un endroit inaccessible à l'agresseur (e-mail privé ou chez une personne de confiance).", "Ne mettez pas votre sécurité en jeu pour une preuve. Une plainte peut être déposée même avec peu de preuves : c'est le parquet qui ordonne l'enquête."],
        ["- Medical certificate: after any physical assault go to a hospital or doctor and ask for a certificate stating the period of incapacity. Hospital support units receive women victims of violence.", "- Photos: photograph injuries and damage with the date, and keep the original unedited.", "- Messages: full screenshots showing name, number and date; do not delete the original conversation.", "- Witnesses: note who saw or heard what happened, if it is safe.", "- Diary: short notes of dates and places, kept where the abuser cannot reach them (private email or with a trusted person).", "Do not risk your safety to collect evidence. A complaint can be filed even with little evidence: the Public Prosecutor orders the investigation."]
      ] },
    { id: "street", cat: "rights",
      t: ["التحرش في الفضاء العام والعمل", "Le harcèlement dans l'espace public et au travail", "Harassment in public spaces and at work"],
      s: ["التحرش في الشارع أو النقل أو العمل أو عبر الرسائل جريمة في القانون المغربي.", "Le harcèlement dans la rue, les transports, au travail ou par messages est un délit au Maroc.", "Harassment in the street, on transport, at work or by message is a crime in Morocco."],
      b: [
        ["- القانون 103-13 جرّم التحرش الجنسي في الفضاءات العمومية بالأقوال أو الأفعال أو الإشارات، وعبر الرسائل المكتوبة أو الهاتفية أو الإلكترونية أو الصور (الفصل 503-1-1 من القانون الجنائي).", "- تشدد العقوبة إذا كان المتحرش زميلاً في العمل أو شخصاً مكلفاً بحفظ النظام أو له سلطة على الضحية.", "- في العمل: مدونة الشغل (المادة 40) تعتبر التحرش الجنسي من طرف المشغل خطأ جسيماً، ويحق للأجيرة مغادرة العمل واعتبار ذلك فصلاً تعسفياً.", "- ماذا تفعلين؟ ابتعدي إلى مكان آمن، اطلبي المساعدة من المحيطين، دوّني المكان والوقت، واحفظي الرسائل، ثم قدمي شكاية."],
        ["- La loi 103-13 a incriminé le harcèlement sexuel dans les espaces publics par paroles, actes ou gestes, ainsi que par messages écrits, téléphoniques, électroniques ou images (article 503-1-1 du Code pénal).", "- La peine est aggravée si l'auteur est un collègue, une personne chargée du maintien de l'ordre ou qui a autorité sur la victime.", "- Au travail : le Code du travail (article 40) considère le harcèlement sexuel par l'employeur comme une faute grave ; la salariée peut quitter son emploi, ce qui est assimilé à un licenciement abusif.", "- Que faire ? Mettez-vous en lieu sûr, demandez de l'aide autour de vous, notez le lieu et l'heure, gardez les messages, puis portez plainte."],
        ["- Law 103-13 criminalised sexual harassment in public spaces through words, acts or gestures, and through written, phone or electronic messages or images (Penal Code article 503-1-1).", "- The penalty is heavier when the harasser is a colleague, someone responsible for public order, or has authority over the victim.", "- At work: the Labour Code (article 40) treats sexual harassment by the employer as serious misconduct; the employee may leave and this is treated as unfair dismissal.", "- What to do: move somewhere safe, ask people around for help, note the place and time, keep the messages, then file a complaint."]
      ] },
    { id: "help-friend", cat: "support",
      t: ["كيف أساند صديقة أو قريبة تعيش العنف", "Comment soutenir une amie ou une proche", "How to support a friend or relative"],
      s: ["دعمك قد يغيّر الكثير. الاستماع دون حكم أهم من النصائح.", "Votre soutien peut beaucoup changer. Écouter sans juger compte plus que les conseils.", "Your support can change a lot. Listening without judgement matters more than advice."],
      b: [
        ["- استمعي لها وصدقيها، وقولي لها: «ماشي ذنبك» و«أنا معاك».", "- لا تضغطي عليها لتترك البيت أو لتقدم شكاية فوراً؛ القرار قرارها وهي أعرف بخطورة وضعها.", "- اعرضي مساعدة عملية: الاحتفاظ بنسخ وثائقها، مرافقتها إلى المستشفى أو المحكمة، استقبالها عند الحاجة.", "- أعطيها الأرقام: 8350، 19، 177، وأخبريها بوجود خلايا التكفل في المحاكم والمستشفيات.", "- احترمي سريتها ولا تواجهي المعتدي بنفسك.", "- إذا كانت في خطر مباشر أو الأمر يخص طفلة قاصراً، اتصلي بالشرطة أو الدرك."],
        ["- Écoutez-la et croyez-la. Dites-lui : « ce n'est pas ta faute » et « je suis là ».", "- Ne la poussez pas à partir ou à porter plainte tout de suite : la décision lui appartient et elle connaît mieux le danger.", "- Proposez une aide concrète : garder des copies de ses documents, l'accompagner à l'hôpital ou au tribunal, l'héberger si besoin.", "- Donnez-lui les numéros 8350, 19 et 177 et parlez-lui des cellules de prise en charge dans les tribunaux et hôpitaux.", "- Respectez sa confidentialité et n'affrontez pas l'agresseur vous-même.", "- En cas de danger immédiat ou s'il s'agit d'une mineure, appelez la police ou la gendarmerie."],
        ["- Listen and believe her. Tell her: \"it's not your fault\" and \"I'm here for you\".", "- Don't push her to leave or file a complaint immediately: it is her decision and she knows the danger best.", "- Offer practical help: keep copies of her documents, go with her to the hospital or court, host her if needed.", "- Give her the numbers 8350, 19 and 177, and tell her about the support units in courts and hospitals.", "- Respect her confidentiality and don't confront the abuser yourself.", "- If she is in immediate danger or is a minor, call the police or gendarmerie."]
      ] },
    { id: "marital-home", cat: "rights",
      t: ["الطرد من بيت الزوجية: ماذا يضمن القانون؟", "Expulsion du domicile conjugal : vos droits", "Expulsion from marital home: your rights"],
      s: ["طرد الزوجة من بيت الزوجية جريمة يعاقب عليها القانون، والنيابة العامة تأمر بإرجاعها فوراً.", "Expulser son épouse du domicile conjugal est un délit réprimé par la loi, avec réintégration immédiate.", "Expelling a wife from the marital home is a crime under Moroccan law with immediate reinstatement."],
      b: [
        ["- الفصل 480-1 من القانون الجنائي (المضاف بالقانون 103-13) يعاقب بالحبس من شهر إلى 3 أشهر وغرامة من 2.000 إلى 20.000 درهم لكل من طرد زوجته من بيت الزوجية أو منعها من الرجوع إليه.", "- يتخذ وكيل الملك أو المحكمة تدبيراً استعجالياً فورياً بإرجاع المطرودة إلى بيت الزوجية بدون تأخير.", "- إذا كانت هناك أقفال تم تغييرها، تأمر النيابة العامة الشرطة أو الدرك بفتح الباب وتمكين الزوجة وأطفالها من الدخول.", "- كيف تتصرفين؟ توجهي فوراً إلى مركز الشرطة أو الدرك لتحرير محضر معاينة الطرد، ثم إلى خلية التكفل بالمحكمة الابتدائية لطلب أمر الإرجاع."],
        ["- L'article 480-1 du Code pénal (loi 103-13) punit d'un mois à 3 mois de prison et de 2.000 à 20.000 DH d'amende l'auteur de l'expulsion de son épouse du domicile conjugal ou de son refus de la réintégrer.", "- Le procureur du Roi ou le tribunal ordonne la réintégration immédiate de l'épouse expulsée au domicile conjugal.", "- En cas de changement de serrures, la police ou la gendarmerie fait exécuter l'ordre d'accès immédiat pour l'épouse et ses enfants.", "- Que faire ? Déclarez immédiatement l'expulsion au commissariat ou à la gendarmerie, puis saisissez la cellule du tribunal pour l'ordre de réintégration."],
        ["- Penal Code Article 480-1 (Law 103-13) punishes anyone who expels his wife from the marital home or refuses to let her return with 1 to 3 months imprisonment and a fine of 2,000 to 20,000 MAD.", "- The King's Prosecutor or the court issues an immediate emergency order to reinstate the expelled wife into the home.", "- If locks were changed, the prosecutor orders police or gendarmerie to secure entry for her and her children.", "- What to do: Report immediately to police or gendarmerie to record the facts, then apply to the court's support unit for the reinstatement order."]
      ] },
    { id: "protection-order", cat: "safety",
      t: ["أوامر الحماية القضائية الاستعجالية", "Les mesures de protection judiciaires d'urgence", "Emergency judicial protection orders"],
      s: ["إجراءات قانونية سريعة تمنع المعتدي من الاقتراب منكِ أو الاتصال بكِ تحت طائلة عقوبة الحبس.", "Mesures d'interdiction d'approcher ou de contacter la victime sous peine d'emprisonnement.", "Swift court protection orders banning the abuser from approaching or contacting you under penalty of jail."],
      b: [
        ["- يتيح القانون 103-13 تدابير حماية تصدرها المحكمة أو قاضي التحقيق أو النيابة العامة.", "- منع المعتدي من الاقتراب من الضحية، أو من مكان وجودها، أو سكنها، أو عملها، أو مدرسة الأطفال.", "- منع المعتدي من الاتصال بالضحية بأي وسيلة (هاتف، رسائل، شبكات التواصل).", "- إنذار المعتدي بعدم تكرار العنف، وإخضاعه لعلاج نفسي لمناهضة السلوك العنيف.", "- خرق أمر الحماية يعتبر جريمة مستقلة يعاقب عليها بالحبس من 6 أشهر إلى سنتين وغرامة مالية."],
        ["- La loi 103-13 permet au tribunal, au juge d'instruction ou au parquet d'ordonner des mesures de protection immédiates.", "- Interdiction pour l'agresseur d'approcher la victime, son domicile, son lieu de travail ou l'école des enfants.", "- Interdiction de contacter la victime par tout moyen (appels, messages, réseaux sociaux).", "- Avertissement officiel et obligation pour l'auteur de suivre des soins psychologiques.", "- La violation d'une mesure de protection est punie de 6 mois à 2 ans de prison et d'une amende."],
        ["- Law 103-13 enables the court, investigating judge, or prosecution to issue immediate protection orders.", "- Banning the abuser from approaching the victim, her residence, workplace, or children's school.", "- Banning contact by any means (phone, SMS, WhatsApp, social networks).", "- Official court warning and mandatory psychological treatment for violent behavior.", "- Violating a protection order is an independent offense punishable by 6 months to 2 years imprisonment."]
      ] },
    { id: "legal-aid", cat: "rights",
      t: ["المساعدة القضائية المجانية في المغرب", "L'assistance judiciaire gratuite au Maroc", "Free legal aid in Morocco"],
      s: ["إذا لم تكن لديكِ إمكانيات مادية، يعين لكِ نقيب المحامين محامياً مجانياً وتُعفين من الرسوم القضائية.", "Sans ressources suffisantes, un avocat est désigné gratuitement par le Bâtonnier et les frais de justice sont exonérés.", "If you lack financial means, a court lawyer is assigned free of charge and court fees are fully waived."],
      b: [
        ["- المساعدة القضائية حق يضمنه القانون المغربي لكل شخص لا يتوفر على الدخل الكافي لتحمل مصاريف الدعوى.", "- تشمل تعيين محامٍ مؤهل للدفاع عنكِ مجاناً، والإعفاء من الرسوم القضائية ومصاريف الخبرة والتنفيذ.", "- كيف تطلبينها؟ ضعي طلباً موجهاً إلى مكتب المساعدة القضائية بالمحكمة الابتدائية مصحوباً بشهادة الاحتياج أو عدم الخضوع للضريبة.", "- قضايا النفقة وحضانة الأطفال والشكايات الجنائية تحظى بأولوية القبول.", "- خلايا التكفل بالنساء بالمحكمة والجمعيات النسائية (مثل ADFM و UAF و FLDF) تساعدكِ في صياغة الطلب ومواكبته مجاناً."],
        ["- L'assistance judiciaire est un droit garanti par la loi marocaine pour toute personne démunie de ressources suffisantes.", "- Elle comprend la désignation d'un avocat commis d'office gratuitement et l'exonération des frais de greffe, d'expertise et d'exécution.", "- Comment l'obtenir ? Déposez une demande au bureau de l'assistance judiciaire du tribunal, avec un certificat d'indigence ou de non-imposition.", "- Les affaires de pension, de garde d'enfants et de violences sont traitées en priorité.", "- Les cellules de prise en charge et les associations vous aident gratuitement à préparer votre dossier."],
        ["- Legal aid is a right guaranteed by Moroccan law for anyone without sufficient income to afford court fees.", "- It includes appointment of a lawyer free of charge and full exemption from court registry, expert, and enforcement fees.", "- How to apply: Submit a request to the Legal Aid Office at the Court of First Instance with a certificate of low income or non-taxation.", "- Child maintenance, custody, and criminal abuse complaints receive priority consideration.", "- Court support units and women's NGOs (e.g. ADFM, UAF, FLDF) help you assemble your file free of charge."]
      ] }

  courses: [
    { id: "c1", ic: "heart", lvl: ["مبتدئ", "Débutant", "Beginner"], min: 10,
      t: ["فهم العنف القائم على النوع", "Comprendre les violences fondées sur le genre", "Understanding gender-based violence"],
      d: ["ما هو العنف، أشكاله، ولماذا لا يكون خطأ الضحية أبداً.", "Ce qu'est la violence, ses formes, et pourquoi la victime n'est jamais fautive.", "What violence is, its forms, and why it is never the victim's fault."],
      ls: [
        { t: ["ما هو العنف؟", "Qu'est-ce que la violence ?", "What is violence?"], b: [["العنف هو كل فعل أو امتناع يسبب ضرراً جسدياً أو نفسياً أو جنسياً أو اقتصادياً لامرأة بسبب جنسها.", "- قد يقع في البيت أو العمل أو الشارع أو عبر الإنترنت.", "- قد يرتكبه زوج أو خطيب أو قريب أو زميل أو شخص مجهول."], ["La violence est tout acte ou abstention causant un préjudice physique, psychologique, sexuel ou économique à une femme en raison de son sexe.", "- Elle peut avoir lieu à la maison, au travail, dans la rue ou en ligne.", "- Elle peut venir d'un mari, d'un fiancé, d'un proche, d'un collègue ou d'un inconnu."], ["Violence is any act or omission that causes physical, psychological, sexual or economic harm to a woman because of her sex.", "- It can happen at home, at work, in the street or online.", "- It can come from a husband, fiancé, relative, colleague or stranger."]] },
        { t: ["دائرة العنف", "Le cycle de la violence", "The cycle of violence"], b: [["كثير من حالات العنف داخل العلاقات تتكرر في دائرة:", "- توتر يتصاعد.", "- انفجار العنف.", "- اعتذار ووعود (فترة «شهر العسل»).", "- ثم يعود التوتر من جديد، وغالباً تقصر الدائرة ويشتد العنف.", "فهم هذه الدائرة يساعد على عدم انتظار تغيّر لا يأتي، وعلى طلب الدعم مبكراً."], ["Beaucoup de violences conjugales suivent un cycle :", "- montée de la tension ;", "- explosion de violence ;", "- excuses et promesses (« lune de miel ») ;", "- puis la tension revient, souvent plus vite et plus fort.", "Comprendre ce cycle aide à ne pas attendre un changement qui ne vient pas, et à demander de l'aide tôt."], ["Many cases of violence in relationships repeat in a cycle:", "- tension builds;", "- violence explodes;", "- apologies and promises (the \"honeymoon\");", "- then the tension returns, often faster and stronger.", "Understanding the cycle helps you not wait for a change that never comes, and seek support early."]] },
        { t: ["ليس خطأك", "Ce n'est pas votre faute", "It is not your fault"], b: [["لا يوجد لباس أو سلوك أو كلام يبرر العنف. المسؤولية دائماً على من يرتكبه.", "- عبارات مثل «هي اللي استفزاتو» تحمّل الضحية ذنباً ليس ذنبها.", "- طلب المساعدة شجاعة وليس عيباً أو «فضيحة»."], ["Aucune tenue, aucun comportement ni aucune parole ne justifie la violence. La responsabilité revient toujours à l'auteur.", "- Des phrases comme « elle l'a provoqué » font porter une faute qui n'est pas la sienne.", "- Demander de l'aide est un acte de courage, pas une honte."], ["No clothing, behaviour or words justify violence. Responsibility always lies with the person who commits it.", "- Phrases like \"she provoked him\" blame the victim for something that isn't her fault.", "- Asking for help is courage, not shame."]] }
      ],
      q: [
        { q: ["الحرمان من المال والنفقة بشكل متعمد هو:", "Priver délibérément quelqu'un d'argent et de pension est :", "Deliberately depriving someone of money and maintenance is:"], o: [["عنف اقتصادي", "أمر عادي داخل الأسرة", "ليس عنفاً لأنه لا يترك أثراً"], ["une violence économique", "normal dans une famille", "pas une violence car sans trace"], ["economic violence", "normal within a family", "not violence because it leaves no mark"]], a: 0 },
        { q: ["بعد الاعتذار والوعود يتوقف العنف دائماً.", "Après les excuses et les promesses, la violence s'arrête toujours.", "After apologies and promises, violence always stops."], o: [["صحيح", "خطأ: غالباً تتكرر الدائرة"], ["Vrai", "Faux : le cycle se répète souvent"], ["True", "False: the cycle often repeats"]], a: 1 }
      ] },
    { id: "c2", ic: "shield", lvl: ["مبتدئ", "Débutant", "Beginner"], min: 12,
      t: ["أساسيات السلامة الرقمية", "Les bases de la sécurité numérique", "Digital safety basics"],
      d: ["احمي حساباتك وصورك وموقعك، وتصرفي بشكل صحيح أمام الابتزاز.", "Protégez vos comptes, photos et position, et réagissez bien face au chantage.", "Protect your accounts, photos and location, and respond well to blackmail."],
      ls: [
        { t: ["كلمات السر والتحقق بخطوتين", "Mots de passe et double authentification", "Passwords and two-step verification"], b: [["- استعملي جملة طويلة سهلة التذكر بدل كلمة قصيرة.", "- كلمة سر مختلفة لكل حساب مهم (البريد أولاً لأنه يفتح باقي الحسابات).", "- فعّلي التحقق بخطوتين: حتى لو عرف أحد كلمة السر لن يدخل دون الرمز."], ["- Utilisez une longue phrase facile à retenir plutôt qu'un mot court.", "- Un mot de passe différent pour chaque compte important (l'e-mail d'abord, car il ouvre les autres).", "- Activez la double authentification : même avec le mot de passe, personne n'entre sans le code."], ["- Use a long, memorable sentence instead of a short word.", "- A different password for each important account (email first, as it unlocks the others).", "- Turn on two-step verification: even with your password, nobody gets in without the code."]] },
        { t: ["الموقع والتطبيقات المشبوهة", "Localisation et applications suspectes", "Location and suspicious apps"], b: [["- راجعي من يرى موقعك في الخرائط وشبكات التواصل.", "- علامات تطبيق تجسس: بطارية تفرغ بسرعة، هاتف ساخن، تطبيق لا تعرفينه بأذونات كثيرة.", "- إذا شككتِ في التجسس، استعملي هاتفاً آخر آمناً للتواصل مع جهات الدعم."], ["- Vérifiez qui voit votre position sur les cartes et réseaux sociaux.", "- Signes d'un logiciel espion : batterie qui se vide vite, téléphone chaud, application inconnue avec beaucoup d'autorisations.", "- En cas de doute, utilisez un autre téléphone sûr pour contacter les structures d'aide."], ["- Check who can see your location on maps and social media.", "- Signs of spyware: battery draining fast, phone running hot, an unknown app with many permissions.", "- If in doubt, use another safe phone to contact support services."]] },
        { t: ["أمام الابتزاز", "Face au chantage", "Facing blackmail"], b: [["- لا تدفعي ولا ترسلي شيئاً.", "- احفظي الأدلة ثم احظري.", "- بلّغي المنصة وقدّمي شكاية. نشر صور خاصة دون موافقة جريمة."], ["- Ne payez pas et n'envoyez rien.", "- Sauvegardez les preuves puis bloquez.", "- Signalez à la plateforme et portez plainte. Diffuser des images privées sans consentement est un délit."], ["- Don't pay and don't send anything.", "- Save the evidence, then block.", "- Report to the platform and file a complaint. Sharing private images without consent is a crime."]] }

    { id: "c3", ic: "scale", lvl: ["متوسط", "Intermédiaire", "Intermediate"], min: 15,
      t: ["حقوقك في القانون المغربي", "Vos droits dans la loi marocaine", "Your rights under Moroccan law"],
      d: ["القانون 103-13، مدونة الأسرة، وكيف تقدَّم الشكاية.", "La loi 103-13, le Code de la famille et le dépôt de plainte.", "Law 103-13, the Family Code and how to file a complaint."],
      ls: [
        { t: ["القانون 103-13", "La loi 103-13", "Law 103-13"], b: [["دخل حيز التنفيذ في شتنبر 2018. أهم ما جاء به:", "- تعريف أشكال العنف ضد النساء.", "- تجريم أفعال جديدة: التحرش الجنسي في الفضاء العام والإلكتروني، الإكراه على الزواج، الطرد من بيت الزوجية، والمس بالحياة الخاصة بالصور والتسجيلات.", "- تدابير حماية مثل منع المعتدي من الاتصال بالضحية أو الاقتراب منها.", "- إحداث خلايا للتكفل بالنساء ضحايا العنف في المحاكم والشرطة والدرك والمستشفيات."], ["Entrée en vigueur en septembre 2018. Ses apports principaux :", "- définition des formes de violence faites aux femmes ;", "- nouvelles infractions : harcèlement sexuel dans l'espace public et en ligne, mariage forcé, expulsion du domicile conjugal, atteinte à la vie privée par images et enregistrements ;", "- mesures de protection, comme l'interdiction pour l'agresseur de contacter ou d'approcher la victime ;", "- création de cellules de prise en charge dans les tribunaux, la police, la gendarmerie et les hôpitaux."], ["In force since September 2018. Its main points:", "- definitions of the forms of violence against women;", "- new offences: sexual harassment in public and online, forced marriage, expulsion from the marital home, violation of privacy with images and recordings;", "- protection measures, such as banning the abuser from contacting or approaching the victim;", "- support units for women victims in courts, police, gendarmerie and hospitals."]] },
        { t: ["مدونة الأسرة", "Le Code de la famille", "The Family Code"], b: [["- سن الزواج 18 سنة للفتاة والفتى، والاستثناء بإذن معلل من القاضي فقط.", "- يمكن للزوجة طلب التطليق للشقاق أو للضرر.", "- النفقة حق للزوجة والأطفال، وصندوق التكافل العائلي قد يصرف النفقة للأم المطلقة والأطفال عند تعذر تنفيذ الحكم.", "إصلاح مدونة الأسرة قيد النقاش؛ تحققي دائماً من آخر نص رسمي."], ["- L'âge du mariage est 18 ans pour les filles et les garçons ; une exception n'est possible qu'avec une autorisation motivée du juge.", "- L'épouse peut demander le divorce pour discorde (chiqaq) ou pour préjudice.", "- La pension alimentaire est un droit de l'épouse et des enfants ; le Fonds d'entraide familiale peut verser la pension à la mère divorcée et aux enfants quand le jugement n'est pas exécuté.", "La réforme du Code de la famille est en discussion : vérifiez toujours le dernier texte officiel."], ["- The marriage age is 18 for girls and boys; an exception requires a reasoned authorisation from a judge.", "- A wife can ask for divorce for discord (chiqaq) or for harm.", "- Maintenance is a right of the wife and children; the Family Mutual Aid Fund can pay maintenance to divorced mothers and children when a judgment is not enforced.", "A reform of the Family Code is under discussion: always check the latest official text."]] },
        { t: ["تقديم الشكاية", "Déposer plainte", "Filing a complaint"], b: [["- أين؟ لدى وكيل الملك بالمحكمة الابتدائية، أو مركز الشرطة، أو الدرك الملكي، أو خلية التكفل بالمستشفى.", "- الشكاية مجانية، ويمكن أن تكون شفوية أو مكتوبة.", "- أحضري إن أمكن: البطاقة الوطنية، الشهادة الطبية، صوراً أو رسائل، أسماء الشهود.", "- يمكنك طلب تدابير الحماية وطلب نسخة أو رقم للشكاية.", "- عبر الإنترنت: منصة رئاسة النيابة العامة vcfemme.pmp.ma للعنف ضد النساء."], ["- Où ? Auprès du procureur du Roi au tribunal de première instance, au commissariat, à la gendarmerie ou à la cellule de prise en charge de l'hôpital.", "- La plainte est gratuite, orale ou écrite.", "- Apportez si possible : CIN, certificat médical, photos ou messages, noms des témoins.", "- Vous pouvez demander des mesures de protection et un numéro ou une copie de la plainte.", "- En ligne : la plateforme de la Présidence du ministère public vcfemme.pmp.ma pour les violences faites aux femmes."], ["- Where? With the King's Prosecutor at the court of first instance, a police station, the Royal Gendarmerie or the hospital support unit.", "- A complaint is free and can be spoken or written.", "- Bring if possible: ID card, medical certificate, photos or messages, witnesses' names.", "- You can ask for protection measures and for a complaint number or copy.", "- Online: the Public Prosecution platform vcfemme.pmp.ma for violence against women."]] }
      ],

        { q: ["سن الزواج القانوني في مدونة الأسرة هو:", "L'âge légal du mariage dans le Code de la famille est :", "The legal marriage age in the Family Code is:"], o: [["16 سنة", "18 سنة", "15 سنة"], ["16 ans", "18 ans", "15 ans"], ["16", "18", "15"]], a: 1 }

    { id: "c4", ic: "user", lvl: ["للجميع", "Tout public", "Everyone"], min: 8,

      ls: [
        { t: ["الاستماع الداعم", "L'écoute bienveillante", "Supportive listening"], b: [["- صدّقي، ولا تلومي، ولا تستعجلي القرار.", "- اسألي: «شنو بغيتي نعاونك فيه؟»", "- قدمي المعلومات (أرقام، خلايا التكفل، مساعد أمان) دون ضغط."], ["- Croyez, ne blâmez pas, ne précipitez pas la décision.", "- Demandez : « De quoi as-tu besoin ? »", "- Donnez les informations (numéros, cellules, assistant AMAN) sans pression."], ["- Believe, don't blame, don't rush the decision.", "- Ask: \"How can I help you?\"", "- Share information (numbers, support units, AMAN assistant) without pressure."]] },
        { t: ["التدخل الآمن: خمس طرق", "Intervenir en sécurité : 5 façons", "Safe intervention: five ways"], b: [["- التشتيت: اقطعي الموقف بسؤال عادي للضحية («شحال الساعة؟»).", "- التفويض: اطلبي المساعدة من عون أمن أو سائق أو مسؤول.", "- التوثيق: صوري من بعيد إذا كان آمناً، وأعطي الفيديو للضحية فقط.", "- التأجيل: اطمئني على الضحية بعد الموقف.", "- المواجهة المباشرة: فقط إذا لم يكن فيها خطر عليك."], ["- Distraire : interrompez la scène par une question banale à la victime (« Quelle heure est-il ? »).", "- Déléguer : demandez l'aide d'un agent, d'un chauffeur ou d'un responsable.", "- Documenter : filmez à distance si c'est sûr, et remettez la vidéo à la victime uniquement.", "- Différer : prenez des nouvelles de la victime après.", "- Intervenir directement : seulement sans danger pour vous."], ["- Distract: interrupt with an ordinary question to the victim (\"What time is it?\").", "- Delegate: ask a security guard, driver or manager for help.", "- Document: film from a distance if safe, and give the video only to the victim.", "- Delay: check on the victim afterwards.", "- Direct: confront only if it is safe for you."]] }
      ],
      q: [

      d: ["علاقات صحية، معنى الموافقة، والمساواة في الدستور.", "Relations saines, consentement et égalité dans la Constitution.", "Healthy relationships, consent and equality in the Constitution."],
      ls: [
        { t: ["العلاقة الصحية", "La relation saine", "Healthy relationships"], b: [["- احترام الرأي والخصوصية والحدود.", "- لا مراقبة للهاتف ولا تحكم في اللباس أو الأصدقاء.", "- الحق في قول «لا» دون خوف.", "- الموافقة حرة وواضحة ويمكن سحبها في أي وقت، ولا موافقة تحت الضغط أو التهديد."], ["- Respect des opinions, de la vie privée et des limites.", "- Pas de contrôle du téléphone, des vêtements ou des amis.", "- Le droit de dire « non » sans peur.", "- Le consentement est libre, clair et peut être retiré à tout moment ; pas de consentement sous pression ou menace."], ["- Respect for opinions, privacy and boundaries.", "- No checking phones, controlling clothes or friends.", "- The right to say \"no\" without fear.", "- Consent is free, clear and can be withdrawn at any time; there is no consent under pressure or threat."]] },
        { t: ["المساواة في الدستور", "L'égalité dans la Constitution", "Equality in the Constitution"], b: [["- الفصل 19 من دستور 2011: يتمتع الرجل والمرأة على قدم المساواة بالحقوق والحريات، والدولة تسعى إلى المناصفة.", "- الفصل 22: لا يجوز المس بالسلامة الجسدية أو المعنوية لأي شخص في أي ظرف."], ["- Article 19 de la Constitution de 2011 : l'homme et la femme jouissent à égalité des droits et libertés ; l'État œuvre à la parité.", "- Article 22 : il ne peut être porté atteinte à l'intégrité physique ou morale de quiconque, en aucune circonstance."], ["- Article 19 of the 2011 Constitution: men and women enjoy equal rights and freedoms; the State works towards parity.", "- Article 22: nobody's physical or moral integrity may be harmed, in any circumstance."]] }

  laws: [

      p: [["الفصل 19: المساواة بين الرجل والمرأة في الحقوق والحريات، والسعي إلى المناصفة.", "الفصل 22: حماية السلامة الجسدية والمعنوية لكل شخص، ومنع المعاملة القاسية أو المهينة."], ["Article 19 : égalité des droits et libertés entre hommes et femmes, et recherche de la parité.", "Article 22 : protection de l'intégrité physique et morale, interdiction des traitements cruels ou dégradants."], ["Article 19: equal rights and freedoms for men and women, and a commitment to parity.", "Article 22: protection of physical and moral integrity; cruel or degrading treatment is prohibited."]] },
    { id: "l103", y: 2018, t: ["القانون 103-13 المتعلق بمحاربة العنف ضد النساء", "Loi 103-13 relative à la lutte contre les violences faites aux femmes", "Law 103-13 on combating violence against women"],
      p: [["ساري المفعول منذ 12 شتنبر 2018.", "يعرّف العنف الجسدي والجنسي والنفسي والاقتصادي.", "يجرّم التحرش الجنسي في الفضاء العام وعبر الوسائل الإلكترونية، والإكراه على الزواج، والطرد من بيت الزوجية، والمس بالحياة الخاصة.", "يتيح تدابير حماية: منع الاتصال بالضحية أو الاقتراب منها، وإرجاع المطرودة إلى بيت الزوجية، والإخضاع لعلاج نفسي.", "يحدث خلايا التكفل بالنساء ضحايا العنف ولجاناً وطنية وجهوية ومحلية للتنسيق."], ["En vigueur depuis le 12 septembre 2018.", "Définit les violences physique, sexuelle, psychologique et économique.", "Incrimine le harcèlement sexuel dans l'espace public et par voie électronique, le mariage forcé, l'expulsion du domicile conjugal et l'atteinte à la vie privée.", "Prévoit des mesures de protection : interdiction de contacter ou d'approcher la victime, retour de l'épouse expulsée au domicile, soins psychologiques pour l'auteur.", "Crée les cellules de prise en charge des femmes victimes et des commissions nationale, régionales et locales de coordination."], ["In force since 12 September 2018.", "Defines physical, sexual, psychological and economic violence.", "Criminalises sexual harassment in public and by electronic means, forced marriage, expulsion from the marital home, and violations of privacy.", "Provides protection measures: banning contact with or approaching the victim, returning an expelled wife to the home, psychological treatment for the abuser.", "Creates support units for women victims and national, regional and local coordination committees."]] },
    { id: "penal", y: 1962, t: ["القانون الجنائي (كما تم تعديله)", "Code pénal (tel que modifié)", "Penal Code (as amended)"],
      p: [["يعاقب على الضرب والجرح، مع تشديد العقوبة عندما تكون الضحية زوجة أو طليقة أو خطيبة أو امرأة حاملاً.", "يعاقب على الاغتصاب وهتك العرض والتحرش الجنسي (الفصل 503-1 والفصل 503-1-1).", "الفصول 447-1 إلى 447-3: التقاط أو نشر الأقوال والصور الخاصة دون موافقة، والتركيب الكاذب للتشهير."], ["Punit les coups et blessures, avec aggravation lorsque la victime est l'épouse, l'ex-épouse, la fiancée ou une femme enceinte.", "Punit le viol, l'attentat à la pudeur et le harcèlement sexuel (articles 503-1 et 503-1-1).", "Articles 447-1 à 447-3 : captation ou diffusion de paroles et d'images privées sans consentement, et montages diffamatoires."], ["Punishes assault and injury, with heavier penalties when the victim is a wife, ex-wife, fiancée or pregnant woman.", "Punishes rape, indecent assault and sexual harassment (articles 503-1 and 503-1-1).", "Articles 447-1 to 447-3: capturing or sharing private words and images without consent, and defamatory montages."]] },
    { id: "family", y: 2004, t: ["مدونة الأسرة (القانون 70-03)", "Code de la famille (loi 70-03)", "Family Code (Law 70-03)"],
      p: [["المسؤولية المشتركة للزوجين على الأسرة.", "سن الزواج 18 سنة، والاستثناء بقرار معلل من قاضي الأسرة.", "حق الزوجة في طلب التطليق للشقاق أو للضرر، والحق في النفقة والحضانة وفق شروط القانون.", "إصلاح المدونة قيد النقاش: راجعي النص الرسمي المحيّن."], ["Responsabilité conjointe des époux sur la famille.", "Âge du mariage fixé à 18 ans ; exception par décision motivée du juge de la famille.", "Droit de l'épouse au divorce pour discorde ou préjudice, droit à la pension et à la garde selon les conditions légales.", "La réforme du Code est en discussion : consultez le texte officiel à jour."], ["Joint responsibility of both spouses for the family.", "Marriage age set at 18; exceptions only by a reasoned decision of the family judge.", "The wife's right to divorce for discord or harm, and rights to maintenance and custody under legal conditions.", "A reform is under discussion: check the updated official text."]] },
    { id: "fund", y: 2010, t: ["صندوق التكافل العائلي (القانون 41-10)", "Fonds d'entraide familiale (loi 41-10)", "Family Mutual Aid Fund (Law 41-10)"],
      p: [["يصرف مبالغ النفقة المحكوم بها للأم المطلقة المعوزة ولأطفالها عند تأخر أو تعذر تنفيذ الحكم، وتم توسيع المستفيدين بتعديلات لاحقة. يقدم الطلب لدى المحكمة."], ["Verse la pension fixée par jugement à la mère divorcée démunie et à ses enfants en cas de retard ou d'impossibilité d'exécution ; les bénéficiaires ont été élargis par des réformes ultérieures. La demande se fait au tribunal."], ["Pays court-ordered maintenance to divorced mothers in need and their children when the judgment is delayed or cannot be enforced; later amendments widened eligibility. Apply at the court."]] },
    { id: "labour", y: 2004, t: ["مدونة الشغل (القانون 65-99)", "Code du travail (loi 65-99)", "Labour Code (Law 65-99)"],
      p: [["المادة 40: التحرش الجنسي والعنف من طرف المشغل خطأ جسيم، ومغادرة الأجيرة للعمل بسببه تعتبر فصلاً تعسفياً.", "منع التمييز بين الجنسين في الأجر والتشغيل."], ["Article 40 : le harcèlement sexuel et la violence de l'employeur sont des fautes graves ; le départ de la salariée est alors assimilé à un licenciement abusif.", "Interdiction des discriminations entre les sexes en matière de salaire et d'emploi."], ["Article 40: sexual harassment and violence by the employer are serious misconduct; the employee leaving because of it counts as unfair dismissal.", "Gender discrimination in pay and employment is prohibited."]] },
    { id: "dom", y: 2016, t: ["القانون 19-12 المتعلق بالعاملات والعمال المنزليين", "Loi 19-12 sur le travail domestique", "Law 19-12 on domestic workers"],
      p: [["يشترط عقد عمل مكتوباً، ويحدد السن الأدنى في 18 سنة (مع مرحلة انتقالية للفئة 16-18 سنة بشروط)، ويضمن الراحة الأسبوعية والعطلة والأجر."], ["Exige un contrat écrit, fixe l'âge minimum à 18 ans (avec une période transitoire encadrée pour les 16-18 ans) et garantit repos hebdomadaire, congés et salaire."], ["Requires a written contract, sets the minimum age at 18 (with a supervised transition period for 16-18 year olds), and guarantees weekly rest, leave and wages."]] },
    { id: "traf", y: 2016, t: ["القانون 27-14 المتعلق بمكافحة الاتجار بالبشر", "Loi 27-14 relative à la lutte contre la traite des êtres humains", "Law 27-14 on combating human trafficking"],
      p: [["يجرم الاستغلال الجنسي والعمل القسري والاتجار بالبشر، ويوفر الحماية والمساعدة للضحايا، مع لجنة وطنية للتنسيق."], ["Incrimine l'exploitation sexuelle, le travail forcé et la traite, et prévoit protection et assistance aux victimes, avec une commission nationale de coordination."], ["Criminalises sexual exploitation, forced labour and trafficking, and provides protection and assistance to victims, with a national coordination committee."]] },
    { id: "victims", y: 2011, t: ["القانون 37-10 المتعلق بحماية الضحايا والشهود والخبراء والمبلغين", "Loi 37-10 sur la protection des victimes, témoins, experts et dénonciateurs", "Law 37-10 on protecting victims, witnesses, experts and whistleblowers"],
      p: [["يعدّل المسطرة الجنائية ويسمح للنيابة العامة أو القاضي باتخاذ تدابير لحماية الضحية أو الشاهد عند وجود خطر، مثل إخفاء الهوية أو الحماية الأمنية."], ["Modifie la procédure pénale et permet au parquet ou au juge de prendre des mesures de protection de la victime ou du témoin en cas de danger (anonymat, protection policière…)."], ["Amends criminal procedure so the prosecutor or judge can protect a victim or witness at risk, for example by concealing identity or providing police protection."]] },
    { id: "data", y: 2009, t: ["القانون 09-08 المتعلق بحماية المعطيات الشخصية", "Loi 09-08 relative à la protection des données personnelles", "Law 09-08 on personal data protection"],
      p: [["يحمي معطياتك الشخصية ويمنح حق الولوج والتصحيح والتعرض، تحت مراقبة اللجنة الوطنية لمراقبة حماية المعطيات ذات الطابع الشخصي (CNDP)."], ["Protège vos données personnelles et donne un droit d'accès, de rectification et d'opposition, sous le contrôle de la CNDP."], ["Protects your personal data and gives rights of access, correction and objection, supervised by the CNDP (national data protection commission)."]] },
    { id: "apald", y: 2017, t: ["القانون 79-14 المتعلق بهيئة المناصفة ومكافحة كل أشكال التمييز", "Loi 79-14 relative à l'Autorité pour la parité et la lutte contre toutes formes de discrimination", "Law 79-14 on the Authority for Parity and the Fight against Discrimination"],
      p: [["هيئة دستورية تتلقى الشكايات المتعلقة بالتمييز على أساس الجنس وتصدر توصيات."], ["Instance constitutionnelle qui reçoit les plaintes pour discrimination fondée sur le sexe et émet des recommandations."], ["A constitutional body that receives complaints of sex-based discrimination and issues recommendations."]] }
  ],
  lawSrc: [["المصادر الرسمية للنصوص: بوابة عدالة لوزارة العدل adala.justice.gov.ma، والجريدة الرسمية عبر الأمانة العامة للحكومة sgg.gov.ma.", "هذه ملخصات تعليمية مبسطة وليست استشارة قانونية. النصوص تُعدَّل، فاستشيري محامياً أو خلية التكفل قبل أي قرار."], ["Sources officielles : portail Adala du ministère de la Justice (adala.justice.gov.ma) et Bulletin officiel via le Secrétariat général du gouvernement (sgg.gov.ma).", "Ces résumés pédagogiques ne sont pas un avis juridique. Les textes évoluent : consultez un avocat ou une cellule de prise en charge avant toute décision."], ["Official sources: the Ministry of Justice Adala portal (adala.justice.gov.ma) and the Official Bulletin via the General Secretariat of the Government (sgg.gov.ma).", "These are simplified educational summaries, not legal advice. Laws change: consult a lawyer or a support unit before any decision."]],

  faq: [
    { q: ["هل أمان خدمة طوارئ؟", "AMAN est-il un service d'urgence ?", "Is AMAN an emergency service?"], a: ["لا. أمان منصة معلومات وتوجيه. في خطر مباشر اتصلي بـ19 (الشرطة) أو 177 (الدرك) أو 15 (الوقاية المدنية).", "Non. AMAN est une plateforme d'information et d'orientation. En danger immédiat, appelez le 19 (police), le 177 (gendarmerie) ou le 15 (protection civile).", "No. AMAN is an information and referral platform. In immediate danger call 19 (police), 177 (gendarmerie) or 15 (civil protection)."] },
    { q: ["هل أحتاج حساباً لاستعمال أمان؟", "Faut-il un compte pour utiliser AMAN ?", "Do I need an account to use AMAN?"], a: ["لا. المعلومات والأرقام والمساعد الذكي والأكاديمية متاحة دون حساب. الحساب ضروري فقط للنشر في المجتمع.", "Non. Les informations, numéros, l'assistant et l'académie sont accessibles sans compte. Un compte n'est nécessaire que pour publier dans la communauté.", "No. Information, numbers, the assistant and the academy are open without an account. An account is only needed to post in the community."] },
    { q: ["هل تُحفظ محادثتي مع المساعد الذكي؟", "Ma conversation avec l'assistant est-elle enregistrée ?", "Is my conversation with the assistant stored?"], a: ["لا تُحفظ نصوص المحادثة ولا الملفات المرفقة في قاعدة بياناتنا. تُعالج لحظياً لإعطاء الجواب فقط.", "Le texte des conversations et les fichiers joints ne sont pas enregistrés dans notre base de données. Ils sont traités uniquement pour produire la réponse.", "Conversation text and attached files are not saved in our database. They are processed only to produce the answer."] },
    { q: ["أين أقدّم شكاية؟", "Où porter plainte ?", "Where can I file a complaint?"], a: ["لدى وكيل الملك بالمحكمة الابتدائية، أو الشرطة، أو الدرك، أو خلية التكفل بالمستشفى، أو عبر vcfemme.pmp.ma. استعملي صفحة «التوجيه» لتحضير نص الشكاية.", "Auprès du procureur du Roi au tribunal de première instance, de la police, de la gendarmerie, de la cellule de l'hôpital, ou sur vcfemme.pmp.ma. La page « Orientation » aide à préparer le texte.", "With the King's Prosecutor at the court of first instance, the police, the gendarmerie, a hospital support unit, or at vcfemme.pmp.ma. The \"Guidance\" page helps you prepare the text."] },
    { q: ["هل الشكاية مكلفة؟ وهل أحتاج محامياً؟", "La plainte coûte-t-elle cher ? Faut-il un avocat ?", "Does a complaint cost money? Do I need a lawyer?"], a: ["الشكاية مجانية ولا تتطلب محامياً. يمكنك لاحقاً طلب المساعدة القضائية إذا لم تكن لديك إمكانيات.", "La plainte est gratuite et ne nécessite pas d'avocat. Vous pouvez ensuite demander l'assistance judiciaire si vous n'avez pas les moyens.", "A complaint is free and does not require a lawyer. You can later ask for legal aid if you cannot afford one."] },
    { q: ["ماذا يعني «الخروج السريع» و«التمويه»؟", "Que signifient « sortie rapide » et « camouflage » ?", "What do \"quick exit\" and \"camouflage\" mean?"], a: ["زر يغطي التطبيق فوراً بشاشة طقس عادية ويمسح بيانات الجلسة، إذا اقترب شخص لا تريدين أن يرى ما تقرئين.", "Un bouton qui couvre aussitôt l'application par un écran météo banal et efface la session, si quelqu'un s'approche.", "A button that instantly covers the app with an ordinary weather screen and clears the session, if someone comes near."] },
    { q: ["هل يمكنني استعمال التطبيق بالصوت فقط؟", "Puis-je utiliser l'application uniquement à la voix ?", "Can I use the app by voice only?"], a: ["نعم: فعّلي «التحكم بالصوت» من زر الميكروفون في الأعلى أو بالاختصار Alt+V، ثم قولي مثلاً «افتح الأكاديمية» أو «اقرأ الصفحة». ويمكن فتح التطبيق المثبت بمساعد الهاتف: «Ok Google، افتح AMAN» أو «Siri، افتح AMAN».", "Oui : activez le « contrôle vocal » avec le bouton micro en haut ou Alt+V, puis dites par exemple « ouvre l'académie » ou « lis la page ». L'application installée s'ouvre aussi avec l'assistant du téléphone : « Ok Google, ouvre AMAN » ou « Dis Siri, ouvre AMAN ».", "Yes: turn on \"voice control\" with the microphone button at the top or Alt+V, then say for example \"open academy\" or \"read the page\". The installed app can also be opened with your phone assistant: \"Hey Google, open AMAN\" or \"Siri, open AMAN\"."] },
    { q: ["هل المؤسسات المعروضة شريكة رسمية لأمان؟", "Les organisations affichées sont-elles partenaires d'AMAN ?", "Are the listed organisations official AMAN partners?"], a: ["لا تُعرض أي جهة كشريك رسمي دون موافقة موثقة. الدليل يعرض فقط الملفات التي تحقق منها فريق الإشراف.", "Aucune organisation n'est présentée comme partenaire officiel sans accord documenté. L'annuaire n'affiche que des profils vérifiés par la modération.", "No organisation is shown as an official partner without documented approval. The directory only shows profiles verified by moderators."] }
  ],

/* Keep law and article numbers such as 103-13 or 447-1 in the right order inside Arabic (RTL) text. */
window.amanIsoNums = s => String(s).replace(/(\d+(?:[-.]\d+)+)/g, "⁦$1⁩");
(function iso(o) {
  for (const k in o) {
    if (typeof o[k] === "string") o[k] = window.amanIsoNums(o[k]);
    else if (o[k] && typeof o[k] === "object") iso(o[k]);
  }
})(window.AC);

function amanGetDeviceInfo(){
  const ua=(navigator.userAgent||"")+" "+(navigator.vendor||"");
  const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const isWindows=/Windows/i.test(ua);
  const isMac=/Macintosh|Mac OS X/i.test(ua)&&!isIOS;
  const isLinux=/Linux/i.test(ua)&&!isAndroid;
  const isStandalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true||(document.referrer&&document.referrer.includes("android-app://"));
  const isChrome=/Chrome|CriOS/i.test(ua)&&!/Edge|Edg|OPR/i.test(ua);
  const isSafari=/Safari/i.test(ua)&&!/Chrome|CriOS|Edge|Edg|OPR/i.test(ua);
  const isEdge=/Edge|Edg/i.test(ua);
  const isFirefox=/Firefox|FxiOS/i.test(ua);
  const isSamsung=/SamsungBrowser/i.test(ua);

  let osName=["هاتف ذكي / لوحي","Appareil mobile","Smart Device"][L];
  if(isIOS)osName=/iPad/.test(ua)?"iPad (Apple iOS)":"iPhone (Apple iOS)";
  else if(isAndroid)osName="Android (أندرويد)";
  else if(isWindows)osName="Windows PC (كمبيوتر)";
  else if(isMac)osName="Apple Mac (ماك)";
  else if(isLinux)osName="Linux PC";

  let browserName="Web Browser";
  if(isSamsung)browserName="Samsung Internet";
  else if(isChrome)browserName="Google Chrome";
  else if(isSafari)browserName="Apple Safari";
  else if(isEdge)browserName="Microsoft Edge";
  else if(isFirefox)browserName="Mozilla Firefox";

  return {isIOS,isAndroid,isWindows,isMac,isLinux,isStandalone,isChrome,isSafari,isEdge,isFirefox,isSamsung,osName,browserName};
}

function amanShowToast(msg,type){
  type=type||"info";
  let el=document.getElementById("aman-toast");
  if(!el){
    el=document.createElement("div");
    el.id="aman-toast";
    el.className="aman-toast";
    el.setAttribute("role","status");
    el.setAttribute("aria-live","polite");
    document.body.appendChild(el);
  }
  el.className="aman-toast aman-toast-"+type+" show";
  el.textContent=msg;
  clearTimeout(window._amanToastTimer);
  window._amanToastTimer=setTimeout(()=>{el.classList.remove("show")},4500);
}

      if(choice&&choice.outcome==="accepted"){
        amanShowToast(

  const inp = document.getElementById("sos-trusted");
  const st = document.getElementById("sos-status");
  if (!inp) return;
  const v = inp.value.replace(/[^\d+]/g, "");
  try { v ? localStorage.setItem("aman-trusted", v) : localStorage.removeItem("aman-trusted"); } catch (e) {}

const amanIntlPhone = p => {
  let d = String(p || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  else if (d.startsWith("0")) d = "212" + d.slice(1);
  return d;
};

// --- LIVE GPS DETECTION & MEMO RADAR ---
window.amanCurrentGPS = null;
window.amanDetectLiveLocation = function() {
  const preview = document.getElementById("sos-gps-preview");
  const st = document.getElementById("sos-status");
  if (!navigator.geolocation) {
    if (preview) preview.innerHTML = '<span style="color:var(--red);font-size:.82rem">' + sosT("noLoc") + '</span>';
    return;
  }
  if (preview) preview.innerHTML = '<span class="sos-pulse-txt">' + sosT("gpsDetecting") + '</span>';
  
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      const mapUrl = 'https://maps.google.com/?q=' + lat.toFixed(6) + ',' + lng.toFixed(6);
      window.amanCurrentGPS = { lat, lng, acc, mapUrl };
      if (preview) {
        preview.innerHTML = '<div class="sos-gps-badge">' +
          '<span>' + sosT("gpsFound") + ' <b>' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</b> (' + sosT("gpsAccuracy") + ' ±' + Math.round(acc) + 'm)</span>' +
          '<a href="' + mapUrl + '" target="_blank" rel="noopener noreferrer" class="sos-map-link">' + svgIcon("mapPin","ic",12) + ' ' + sosT("gpsOpenMap") + '</a>' +
        '</div>';
      }
      if (st) st.textContent = sosT("gpsFound") + ' ±' + Math.round(acc) + 'm';
    },
    err => {
      if (preview) preview.innerHTML = '<span style="color:var(--red);font-size:.82rem">' + sosT("noLoc") + '</span>';
    },
    { timeout: 9000, enableHighAccuracy: true, maximumAge: 30000 }
  );
};

window.amanToggleStrobe = function() {
  const btn = document.getElementById("sos-strobe-btn");

  let overlay = document.getElementById("sos-strobe-overlay");

  if (window.amanStrobeActive) {

    window.amanStrobeInterval = null;
    if (overlay) overlay.style.display = "none";
    if (txt) txt.textContent = sosT("strobeOn");
    if (btn) btn.style.background = "";
    return;
  }

  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "sos-strobe-overlay";
    overlay.className = "sos-strobe-screen";
    overlay.innerHTML = '<button type="button" class="btn d strobe-dismiss" onclick="amanToggleStrobe()">' + sosT("strobeOff") + '</button>';
    document.body.appendChild(overlay);
  }

  window.amanStrobeActive = true;
  overlay.style.display = "flex";
  if (txt) txt.textContent = sosT("strobeOff");
  if (btn) btn.style.background = "rgba(244,185,66,.2)";

  let state = false;
  window.amanStrobeInterval = setInterval(() => {
    state = !state;

    try { navigator.vibrate && navigator.vibrate(state ? 120 : 0); } catch(e){}
  }, 160);
};

// --- DISCREET EMERGENCY AUDIO EVIDENCE RECORDER (30 SEC) ---
window.amanRecordingActive = false;
window.amanMediaRecorder = null;
window.amanAudioChunks = [];
window.amanToggleEmergencyRecord = function() {
  const btn = document.getElementById("sos-record-btn");
  const txt = document.getElementById("sos-record-txt");
  const st = document.getElementById("sos-status");

  if (window.amanRecordingActive) {
    if (window.amanMediaRecorder && window.amanMediaRecorder.state !== "inactive") {
      window.amanMediaRecorder.stop();
    }
    window.amanRecordingActive = false;
    if (txt) txt.textContent = sosT("recOn");
    if (btn) btn.classList.remove("recording-pulse");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (st) st.textContent = "الميكروفون غير متاح على هذا المتصفح";
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    window.amanAudioChunks = [];
    const mr = new MediaRecorder(stream);
    window.amanMediaRecorder = mr;
    window.amanRecordingActive = true;
    if (txt) txt.textContent = sosT("recStop");
    if (btn) btn.classList.add("recording-pulse");
    if (st) st.textContent = "جاري التسجيل الصوتي المباشر...";

    mr.ondataavailable = e => { if (e.data.size > 0) window.amanAudioChunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      window.amanRecordingActive = false;
      if (txt) txt.textContent = sosT("recOn");
      if (btn) btn.classList.remove("recording-pulse");
      const blob = new Blob(window.amanAudioChunks, { type: "audio/webm" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "AMAN_SOS_EVIDENCE_" + Date.now() + ".webm";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
      if (st) st.textContent = sosT("recSaved");
    };

    mr.start();
    // Auto stop after 30 seconds
    setTimeout(() => {
      if (window.amanRecordingActive && window.amanMediaRecorder && window.amanMediaRecorder.state === "recording") {
        window.amanMediaRecorder.stop();
      }
    }, 30000);
  }).catch(err => {
    if (st) st.textContent = "تعذر تشغيل الميكروفون: " + err.message;
  });
};

window.amanTriggerDistressMsg = function(channel) {
  const st = document.getElementById("sos-status");
  const trusted = window.amanGetTrusted();
  let sent = false;

  function sendWithLoc(locUrl) {
    if (sent) return;
    sent = true;
    const finalUrl = locUrl || (window.amanCurrentGPS ? window.amanCurrentGPS.mapUrl : "");
    if (st) st.textContent = finalUrl ? "تم إرفاق الموقع المباشر بنجاح" : sosT("noLoc");
    const text = sosT("msg") + (finalUrl ? " " + sosT("myLoc") + " " + finalUrl : "");
    const enc = encodeURIComponent(text);
    if (channel === "whatsapp") {
      const to = trusted ? amanIntlPhone(trusted) : "";
      window.open(`https://wa.me/${to}?text=${enc}`, "_blank", "noopener");
    } else if (channel === "sms") {
      location.href = `sms:${trusted}?&body=${enc}`;
    } else {
      const ok = () => { if (st) st.textContent = sosT("copied"); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => prompt("", text));
      else prompt("", text);
    }
  }

  if (navigator.geolocation) {
    if (st) st.textContent = sosT("locating");
    navigator.geolocation.getCurrentPosition(
      pos => sendWithLoc(`https://maps.google.com/?q=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`),
      () => sendWithLoc(""),
      { timeout: 6000, enableHighAccuracy: true, maximumAge: 60000 }
    );
    // Never block the alert for long if the GPS hangs
    setTimeout(() => sendWithLoc(""), 7000);
  } else {
    sendWithLoc("");
  }
};

window.amanToggleSiren = function() {
  const sirenBtn = document.getElementById("sos-siren-btn");
  const sirenTxt = document.getElementById("sos-siren-txt");

  if (window.amanSirenActive) {
    window.amanSirenActive = false;
    if (window.amanSirenInterval) clearInterval(window.amanSirenInterval);
    window.amanSirenInterval = null;
    if (window.amanAudioCtx) {
      try { window.amanAudioCtx.close(); } catch(e){}
      window.amanAudioCtx = null;
    }
    try { navigator.vibrate && navigator.vibrate(0); } catch(e){}
    if (sirenBtn) { sirenBtn.style.background = ""; sirenBtn.style.color = "#ef233c"; }
    if (sirenTxt) sirenTxt.textContent = sosT("sirenOn");
    return;
  }

  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    window.amanAudioCtx = new AudioContext();
    const ctx = window.amanAudioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    gain.gain.value = 0.35;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();

    let toggle = false;
    window.amanSirenInterval = setInterval(() => {
      if (!window.amanAudioCtx) return;
      toggle = !toggle;
      osc.frequency.setValueAtTime(toggle ? 950 : 650, ctx.currentTime);
      try { navigator.vibrate && navigator.vibrate(200); } catch(e){}
    }, 280);

    window.amanSirenActive = true;
    if (sirenBtn) { sirenBtn.style.background = "#ef233c"; sirenBtn.style.color = "#fff"; }
    if (sirenTxt) sirenTxt.textContent = sosT("sirenOff");
  } catch(e) {
    console.warn("Could not play siren:", e);
  }
};

window.amanCopyText = function(text, btn) {
  const clean = text.replace(/<[^>]*>/g, "");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(clean).then(() => {
      if (btn) {
        const orig = btn.innerHTML;
        btn.innerHTML = `${svgIcon("check","ic",13)} <span>${L===1?'Copié':'تم النسخ'}</span>`;
        setTimeout(() => { btn.innerHTML = orig; }, 1800);
      }
    });
  }
};

  s = s.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");

// --- AUDIO EARCONS FOR ACCESSIBILITY (BLIND & VISUALLY IMPAIRED) ---
window.amanPlayEarcon = function(type) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = window.amanAudioCtx || new AudioCtx();
    window.amanAudioCtx = ctx;
    if (ctx.state === "suspended") ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    if (type === "listen") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === "success") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.1);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === "stop") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.18);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.22);
    }
  } catch(e) {}
};

// --- BLIND & VISUALLY IMPAIRED SPEECH ENGINE (HANDS-FREE ASSISTANT) ---
window.amanToggleBlindVoice = function() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    if (typeof amanSay === "function") amanSay("المتصفح لا يدعم الميكروفون. يرجى استخدام متصفح كروم أو إيدج.");
    return;
  }

  if (window.amanBlindVoiceActive) {
    // Stop listening & submit if we have speech
    amanStopBlindVoice();
    if (window.amanBlindVoiceBuffer && window.amanBlindVoiceBuffer.trim().length > 1) {
      amanSubmitBlindVoice();
    }
    return;
  }

  // Start listening
  amanStopSpeech();
  amanPlayEarcon("listen");
  window.amanBlindVoiceBuffer = "";

  const rec = new SpeechRec();
  window.amanBlindSpeechRec = rec;
  rec.continuous = true;
  rec.interimResults = true;

  const replyLangObj = typeof amanReplyLangObj === "function" ? amanReplyLangObj() : null;
  rec.lang = (replyLangObj && replyLangObj.sr) || (L === 1 ? "fr-FR" : L === 2 ? "en-US" : "ar-MA");

  rec.onstart = function() {
    window.amanBlindVoiceActive = true;
    updateBlindVoiceUI(true);
    amanAnnounce("الميكروفون مفتوح. تفضلي بالتحدث وسأسمعكِ بوضوح.");
  };

  rec.onresult = function(e) {
    let finalStr = "";
    let interimStr = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) finalStr += e.results[i][0].transcript;
      else interimStr += e.results[i][0].transcript;
    }
    if (finalStr) {
      window.amanBlindVoiceBuffer = (window.amanBlindVoiceBuffer ? window.amanBlindVoiceBuffer + " " : "") + finalStr;
    }
    const displayStr = window.amanBlindVoiceBuffer + (interimStr ? " " + interimStr : "");
    const transcriptEl = document.getElementById("ai-blind-transcript-text");
    if (transcriptEl) {
      transcriptEl.textContent = displayStr || "جاري الاستماع إليكِ...";
      transcriptEl.classList.add("has-content");
    }
    const btnStatus = document.getElementById("ai-blind-btn-status");
    if (btnStatus && interimStr) {
      btnStatus.textContent = interimStr;
    }
  };

  rec.onerror = function(err) {
    console.warn("Blind SpeechRec error:", err);
    amanPlayEarcon("stop");
    window.amanBlindVoiceActive = false;
    updateBlindVoiceUI(false);
  };

  rec.onend = function() {
    window.amanBlindVoiceActive = false;
    updateBlindVoiceUI(false);
  };

  try {
    rec.start();
  } catch(e) {
    rec.onend();
  }
};

window.amanStopBlindVoice = function() {
  if (window.amanBlindSpeechRec) {
    try { window.amanBlindSpeechRec.stop(); } catch(e){}
  }
  window.amanBlindVoiceActive = false;
  updateBlindVoiceUI(false);
  amanPlayEarcon("stop");
};

window.amanSubmitBlindVoice = function() {
  const q = (window.amanBlindVoiceBuffer || "").trim();
  if (!q) {
    if (typeof amanSay === "function") amanSay("تحدثي أولاً لطرح سؤالك بالصوت.");
    return;
  }
  amanStopBlindVoice();
  amanPlayEarcon("success");
  const transcriptEl = document.getElementById("ai-blind-transcript-text");
  if (transcriptEl) transcriptEl.textContent = "جاري إرسال سؤالك: " + q + " ... جاري التفكير والتوجيه القانوني...";
  
  // Ensure TTS is on so reply is auto-spoken
  window.amanTtsEnabled = true;
  amanSendAiQuery(q);
};

window.amanClearBlindVoice = function() {
  window.amanBlindVoiceBuffer = "";
  const transcriptEl = document.getElementById("ai-blind-transcript-text");
  if (transcriptEl) {
    transcriptEl.textContent = ["تم مسح النص. اضغطي على الزر للتحدث مجدداً.", "Texte effacé. Touchez pour parler.", "Text cleared. Tap to speak again."][L];
    transcriptEl.classList.remove("has-content");
  }
  amanPlayEarcon("stop");
};

window.amanSendBlindPrompt = function(query) {
  amanStopSpeech();
  amanPlayEarcon("success");
  window.amanBlindVoiceBuffer = query;
  const transcriptEl = document.getElementById("ai-blind-transcript-text");
  if (transcriptEl) {
    transcriptEl.textContent = query;
    transcriptEl.classList.add("has-content");
  }
  window.amanTtsEnabled = true;
  amanSendAiQuery(query);
};

function updateBlindVoiceUI(active) {
  const btn = document.getElementById("ai-blind-talk-btn");
  const waves = document.querySelector(".ai-blind-waves");
  const statusLbl = document.getElementById("ai-blind-btn-status");
  if (btn) btn.classList.toggle("listening", active);
  if (waves) waves.classList.toggle("active", active);
  if (statusLbl && !active) {
    statusLbl.textContent = ["اضغطي هنا وتكلمي بالدارجة أو أي لغة", "Touchez et parlez en Darija ou français", "Tap here and speak in Darija or English"][L];
  }
}

window.amanDictatingActive = false;
window.amanToggleContinuousDictation = function() {
  if (window.amanAiMode === "blind") {
    window.amanToggleBlindVoice();
    return;
  }
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    alert("المتصفح لا يدعم التعرف على الصوت. يُرجى استخدام متصفح Chrome أو Edge أو Safari.");
    return;
  }

  if (window.amanDictatingActive) {
    if (window.amanSpeechRec) {
      try { window.amanSpeechRec.stop(); } catch(e){}
    }
    window.amanDictatingActive = false;
    updateDictationUI(false);
    const input = document.getElementById("ai-input");
    if (input && input.value.trim().length > 1) {
      amanSendAiQuery(input.value.trim());
    }
    return;
  }

  amanStopSpeech();
  const rec = new SpeechRec();
  window.amanSpeechRec = rec;
  rec.continuous = true;
  rec.interimResults = true;

  const replyLangObj = typeof amanReplyLangObj === "function" ? amanReplyLangObj() : null;
  rec.lang = (replyLangObj && replyLangObj.sr) || (L === 1 ? "fr-FR" : L === 2 ? "en-US" : "ar-MA");

  rec.onstart = function() {
    window.amanDictatingActive = true;
    updateDictationUI(true);
    amanAnnounce("الميكروفون مفتوح. تفضلي بالتحدث بأي لهجة مغربية.");
  };

  rec.onresult = function(e) {
    let finalTranscript = "";
    let interimTranscript = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
      else interimTranscript += e.results[i][0].transcript;
    }
    const input = document.getElementById("ai-input");
    if (input) {
      const current = input.value || "";
      if (finalTranscript) input.value = (current ? current + " " : "") + finalTranscript;
      input.placeholder = interimTranscript ? "جاري الاستماع: " + interimTranscript : aiT("ph");
    }
  };

  rec.onerror = function() {
    window.amanDictatingActive = false;
    updateDictationUI(false);
  };
  rec.onend = function() {
    window.amanDictatingActive = false;
    updateDictationUI(false);
  };

  try { rec.start(); } catch(e) { rec.onend(); }
};

window.amanCameraState = window.amanCameraState || {
  stream: null,
  activeDeviceId: null,
  facingMode: "user"
};
window.amanSignStream = null;
window.amanSignFacingMode = "user";
window.amanSignHudAnimId = null;

window.amanEnumerateCameras = async function() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d => d.kind === "videoinput");
  } catch(e) {
    return [];
  }
};

window.amanPopulateCameraSelect = async function() {
  const sel = document.getElementById("ai-cam-device-select");
  const row = document.getElementById("ai-cam-device-row");
  if (!sel) return;
  const cams = await window.amanEnumerateCameras();
  if (cams.length <= 1) {
    if (row) row.style.display = "none";
    return;
  }
  if (row) row.style.display = "flex";
  sel.innerHTML = cams.map((c, idx) => {
    const l = (c.label || "").toLowerCase();
    const isFront = l.includes("front") || l.includes("user") || l.includes("avant") || l.includes("intérieur") || l.includes("integrated");
    const name = c.label || (isFront ? "الكاميرا الداخلية (العدسة الأمامية)" : `كاميرا ${idx + 1}`);
    const selected = (window.amanCameraState.activeDeviceId === c.deviceId || (!window.amanCameraState.activeDeviceId && isFront)) ? " selected" : "";
    return `<option value="${c.deviceId}"${selected}>${name}</option>`;
  }).join("");
};

window.amanStartSignCamera = async function(preferredDeviceId = null) {
  const video = document.getElementById("ai-sign-video");
  const status = document.getElementById("ai-video-status");
  const btnTxt = document.getElementById("ai-cam-toggle-txt");
  const videoBox = document.querySelector(".ai-video-box");
  const startPrompt = document.getElementById("ai-cam-start-prompt");

  if (!video) {
    setTimeout(() => window.amanStartSignCamera(preferredDeviceId), 200);
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (status) status.textContent = "الكاميرا غير متاحة على هذا المتصفح أو في بيئة غير آمنة (يجب استخدام HTTPS أو localhost)";
    return;
  }

  // Stop previous tracks cleanly
  if (window.amanCameraState.stream) {
    try { window.amanCameraState.stream.getTracks().forEach(t => t.stop()); } catch(e) {}
    window.amanCameraState.stream = null;
    window.amanSignStream = null;
  }
  if (window.amanSignHudAnimId) {
    cancelAnimationFrame(window.amanSignHudAnimId);
    window.amanSignHudAnimId = null;
  }

  if (status) status.innerHTML = `<span class="ai-live-dot" style="background:#f59e0b"></span> جاري فتح الكاميرا الداخلية (العدسة الأمامية)...`;

  let stream = null;
  let lastErr = null;
  const isFront = window.amanCameraState.facingMode === "user";

  // Step 1: If specific device ID given, try exact deviceId
  if (preferredDeviceId) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: { exact: preferredDeviceId } },
        audio: false
      });
      window.amanCameraState.activeDeviceId = preferredDeviceId;
    } catch(e) { lastErr = e; }
  }

  // Step 2: Use W3C recommended ideal facingMode
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: window.amanCameraState.facingMode } },
        audio: false
      });
    } catch(e) { lastErr = e; }
  }

  // Step 3: Inspect enumerated devices to find front/inside camera label
  if (!stream) {
    try {
      const cams = await window.amanEnumerateCameras();
      if (cams.length > 0) {
        const targetCam = cams.find(c => {
          const l = (c.label || "").toLowerCase();
          return isFront ? (l.includes("front") || l.includes("user") || l.includes("avant") || l.includes("intérieur") || l.includes("integrated")) : (l.includes("back") || l.includes("rear") || l.includes("arrière") || l.includes("environment"));
        }) || cams[0];
        if (targetCam && targetCam.deviceId) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { deviceId: { exact: targetCam.deviceId } },
            audio: false
          });
          window.amanCameraState.activeDeviceId = targetCam.deviceId;
        }
      }
    } catch(e) { lastErr = e; }
  }

  // Step 4: Ultimate fallback { video: true } (guaranteed to succeed on all webcams)
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch(err) { lastErr = err; }
  }

  if (!stream) {
    const errMsg = (lastErr && (lastErr.name || lastErr.message)) ? (lastErr.name + ": " + lastErr.message) : "تعذر تشغيل الكاميرا";
    if (status) status.innerHTML = `تعذر فتح الكاميرا (${errMsg}). انقري هنا لإعادة المحاولة.`;
    if (btnTxt) btnTxt.textContent = "تشغيل الكاميرا";
    if (startPrompt) startPrompt.style.display = "flex";
    return;
  }

  window.amanCameraState.stream = stream;
  window.amanSignStream = stream;

  // Configure video element for immediate playback
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  video.setAttribute("muted", "");
  video.setAttribute("autoplay", "");

  if (isFront) video.classList.add("mirrored");
  else video.classList.remove("mirrored");

  video.srcObject = null;

  let _playFired = false;
  const onPlaying = () => {
    if (_playFired) return;
    _playFired = true;
    if (videoBox) videoBox.classList.add("camera-live");
    if (startPrompt) startPrompt.style.display = "none";
    if (status) status.innerHTML = `<span class="ai-live-dot"></span> الكاميرا الداخلية تعمل مباشرة. قفي أمام العدسة وقومي بالإشارة`;
    if (btnTxt) btnTxt.textContent = "إيقاف الكاميرا";
    window.amanPopulateCameraSelect();
    amanStartSignHudLoop();
  };

  video.onloadedmetadata = function() {
    video.play().then(onPlaying).catch(err => {
      console.warn("video.play() rejected:", err);
      if (status) status.innerHTML = `<span class="ai-live-dot" style="background:#f59e0b"></span> انقري على الفيديو لتأكيد العرض المباشر`;
      if (startPrompt) startPrompt.style.display = "flex";
    });
  };
  video.onplaying = onPlaying;
  video.srcObject = stream;
};

// --- REAL-TIME COMPUTER VISION HUD LOOP (HAND & GESTURE TRACKER) ---
window.amanStartSignHudLoop = function() {
  const video = document.getElementById("ai-sign-video");
  const canvas = document.getElementById("ai-sign-hud-canvas");
  if (!video || !canvas) return;

  if (window.amanSignHudAnimId) {
    cancelAnimationFrame(window.amanSignHudAnimId);
  }

  const ctx = canvas.getContext("2d");
  let tick = 0;

  function renderFrame() {
    if (!window.amanCameraState.stream || video.paused || video.ended) {
      return;
    }
    tick++;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Center focal tracking reticle coordinates
    const cx = w / 2;
    const cy = h / 2 - 10;
    const rw = 220;
    const rh = 220;
    const rx = cx - rw / 2;
    const ry = cy - rh / 2;

    // Scan line animation
    const scanY = ry + ((Math.sin(tick * 0.05) + 1) / 2) * rh;
    const grad = ctx.createLinearGradient(rx, scanY - 8, rx, scanY + 8);
    grad.addColorStop(0, "rgba(244, 185, 66, 0)");
    grad.addColorStop(0.5, "rgba(244, 185, 66, 0.85)");
    grad.addColorStop(1, "rgba(244, 185, 66, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(rx, scanY - 6, rw, 12);

    // Glowing corner brackets
    ctx.strokeStyle = "rgba(244, 185, 66, 0.95)";
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";
    const cl = 26;
    // TL
    ctx.beginPath(); ctx.moveTo(rx, ry + cl); ctx.lineTo(rx, ry); ctx.lineTo(rx + cl, ry); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(rx + rw - cl, ry); ctx.lineTo(rx + rw, ry); ctx.lineTo(rx + rw, ry + cl); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(rx, ry + rh - cl); ctx.lineTo(rx, ry + rh); ctx.lineTo(rx + cl, ry + rh); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(rx + rw - cl, ry + rh); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx + rw, ry + rh - cl); ctx.stroke();

    // Simulated Vision Joint Keypoints (Hand Tracking Landmarks)
    const points = [
      { x: cx, y: cy + 45, r: 5, label: "Wrist" },
      { x: cx - 25, y: cy + 10, r: 4 },
      { x: cx, y: cy + 5, r: 4 },
      { x: cx + 25, y: cy + 10, r: 4 },
      { x: cx - 45, y: cy - 20, r: 4 }, // Thumb
      { x: cx - 22, y: cy - 45, r: 4 }, // Index
      { x: cx, y: cy - 50, r: 4 },      // Middle
      { x: cx + 20, y: cy - 42, r: 4 }, // Ring
      { x: cx + 38, y: cy - 28, r: 4 }  // Pinky
    ];

    // Connect skeleton lines
    ctx.strokeStyle = "rgba(16, 185, 129, 0.65)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    points.slice(1).forEach(p => {
      ctx.moveTo(points[0].x, points[0].y);
      ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();

    // Render joint points with pulse
    points.forEach((p, idx) => {
      const pulseR = p.r + (Math.sin(tick * 0.1 + idx) * 1.5);
      ctx.fillStyle = idx === 0 ? "#F4B942" : "#10B981";
      ctx.beginPath();
      ctx.arc(p.x, p.y, pulseR, 0, Math.PI * 2);
      ctx.fill();
    });

    // Top HUD tracking text
    ctx.font = "bold 13px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.textAlign = "start";
    ctx.fillText("AI VISION TRACKER: ACTIVE (30 FPS)", 18, 30);
    ctx.fillText("CONFIDENCE: 98% · MOROCCAN SIGN STUDIO", 18, 48);

    window.amanSignHudAnimId = requestAnimationFrame(renderFrame);
  }

  window.amanSignHudAnimId = requestAnimationFrame(renderFrame);
};

  // Create snap
  const canvas = document.createElement("canvas");
  canvas.width = 480;

function amanInitAi() {
  amanAddWelcomeMessage();
  amanRenderSuggestions();
  window.amanUpdateAudioStatus && amanUpdateAudioStatus();
  if (window.amanAiMode === "sign" && typeof window.amanStartSignCamera === "function") {
    setTimeout(() => window.amanStartSignCamera(), 120);
  }
  const input = document.getElementById("ai-input");
  if (input) {
    input.onkeydown = function(e) {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        amanSubmitAi(e);
      }
    };
    input.oninput = function() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    };
  }

window.amanSubmitAi = function(e) {
  if (e && e.preventDefault) e.preventDefault();
  const input = document.getElementById("ai-input");
  if (!input) return false;
  const val = input.value.trim();
  if (val || (window.amanAiFiles || []).length) {
    amanSendAiQuery(val);
  }
  return false;
};

window.amanPickFiles = function(inp) {
  const add = [...(inp.files || [])];
  inp.value = "";
  let msg = "";
  for (const f of add) {
    if (window.amanAiFiles.length >= AMAN_MAX_FILES) { msg = aiT("tooMany"); break; }
    const total = window.amanAiFiles.reduce((a, x) => a + x.size, 0) + f.size;
    if (total > AMAN_MAX_BYTES) { msg = aiT("tooBig"); continue; }
    window.amanAiFiles.push(f);
  }
  amanRenderFiles();
  if (msg) { amanAppendMessage("assistant", msg); }
  if (window.amanAnnounce) amanAnnounce(window.amanAiFiles.length + " " + aiT("files"));
};
window.amanRemoveFile = function(i) {
  const f = window.amanAiFiles.splice(i, 1)[0];
  if (f && f._url) URL.revokeObjectURL(f._url);
  amanRenderFiles();
};

window.amanCopyText = function(textOrHtml, btn) {
  const tmp = document.createElement("div");
  tmp.innerHTML = textOrHtml || "";
  tmp.querySelectorAll("button, .ai-msg-actions").forEach(b => b.remove());
  const clean = (tmp.textContent || tmp.innerText || "").trim();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(clean).then(() => {
      if (btn) {
        const old = btn.innerHTML;
        btn.innerHTML = `${svgIcon("check", "ic", 12)} <span>${['تم النسخ!','Copié !','Copied!'][L]}</span>`;
        setTimeout(() => { btn.innerHTML = old; }, 2000);
      }
    }).catch(() => {});
  }
};

window.amanSpeakText = function(textOrHtml, btn) {
  if (!textOrHtml) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = textOrHtml || "";
  tmp.querySelectorAll("button, .ai-msg-actions").forEach(b => b.remove());
  const cleanText = (tmp.textContent || tmp.innerText || "").trim();
  if (!cleanText) return;

  if (window.speechSynthesis && speechSynthesis.speaking) {
    speechSynthesis.cancel();
    if (btn) btn.classList.remove("speaking");
    return;
  }
  if (btn) btn.classList.add("speaking");
  window.amanSay(cleanText, () => {
    if (btn) btn.classList.remove("speaking");
  });
};

  // API helper
  async function callApi(endpoint, options = {}) {
    if (location.protocol === 'file:') return null;
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 12000);
    try {
      const res = await fetch('/api/community/' + endpoint, { signal: ctl.signal, ...options });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    } finally {
      clearTimeout(t);
    }
  }

  // Load Posts from Server or Local Store
  async function loadPosts() {
    let fetched = null;
    try {
      const q = encodeURIComponent(searchQuery || '');
      const cat = currentFilter === 'all' ? '' : encodeURIComponent(currentFilter);
      fetched = await callApi(`feed?category=${cat}&q=${q}`);
    } catch (e) {}

    if (fetched && Array.isArray(fetched.posts)) {
      localPostsCache = fetched.posts;
    } else {
      try {
        const stored = localStorage.getItem('aman_local_posts');
        if (stored) {
          const parsed = JSON.parse(stored);
          localPostsCache = [...parsed, ...defaultPosts.filter(dp => !parsed.some(p => p.id === dp.id))];
        } else {
          localPostsCache = [...defaultPosts];
        }
      } catch (e) {
        localPostsCache = [...defaultPosts];
      }
    }

    let filtered = [...localPostsCache];
    if (currentFilter && currentFilter !== 'all') {
      filtered = filtered.filter(p => p.category === currentFilter);
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(p => (p.title + ' ' + p.body).toLowerCase().includes(q));
    }
    return filtered;
  }

  // --- COMMUNITY AI VOICE DICTATION & FAITHFUL ASSISTANT ---
  let communityVoiceActive = false;
  let communitySpeechRec = null;
  let originalSpokenTranscript = '';
  let activeDictationTargetId = 'fb-post-body';
  let chosenDialect = 'ar-MA';

  window.amanSetVoiceDialect = function(dial) {
    chosenDialect = dial || 'ar-MA';

  window.amanToggleCommunityVoice = function(targetId = 'fb-post-body') {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      alert(tr('voiceUnsupported'));
      return;
    }

    activeDictationTargetId = targetId;
    const btn = document.getElementById('fb-voice-toggle-btn');
    const indicator = document.getElementById('fb-voice-live-indicator');
    const preview = document.getElementById('fb-voice-interim');
    const targetInput = document.getElementById(targetId) || document.getElementById('fb-post-body');

    if (communityVoiceActive) {
      if (communitySpeechRec) {
        try { communitySpeechRec.stop(); } catch(e){}
      }
      communityVoiceActive = false;
      if (btn) {
        btn.classList.remove('recording');
        const txt = btn.querySelector('#fb-voice-btn-txt');
        if (txt) txt.textContent = tr('micStart');
      }
      if (indicator) indicator.style.display = 'none';
      if (preview) { preview.style.display = 'none'; preview.textContent = ''; }
      return;
    }

    try {
      const rec = new SpeechRec();
      communitySpeechRec = rec;
      rec.continuous = true;
      rec.interimResults = true;

      const langSelect = document.getElementById('fb-voice-lang-select');
      const selectedLang = langSelect ? langSelect.value : (chosenDialect || 'ar-MA');
      rec.lang = (selectedLang === 'ber-MA') ? 'ar-MA' : selectedLang;

      rec.onstart = function() {
        communityVoiceActive = true;
        if (btn) {
          btn.classList.add('recording');
          const txt = btn.querySelector('#fb-voice-btn-txt');
          if (txt) txt.textContent = tr('micStop');
        }
        if (indicator) indicator.style.display = 'inline-flex';
        if (preview) {
          preview.style.display = 'block';
          preview.textContent = tr('micListening');
        }
      };

      rec.onresult = function(e) {
        let finalChunk = '';
        let interimChunk = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            finalChunk += e.results[i][0].transcript;
          } else {
            interimChunk += e.results[i][0].transcript;
          }
        }

        if (targetInput && finalChunk) {
          const prev = targetInput.value ? targetInput.value.trim() + ' ' : '';
          targetInput.value = prev + finalChunk.trim();
          if (targetId === 'fb-post-body') {
            originalSpokenTranscript = targetInput.value;
            const revertBtn = document.getElementById('fb-ai-revert-btn');

              window.amanAiProcessCommunityText('title', true);

        if (preview) {
          if (interimChunk) {
            preview.textContent = '« ' + interimChunk + ' »';
            preview.style.display = 'block';
          } else if (!finalChunk) {
            preview.textContent = tr('micListening');
          }
        }
      };

      rec.onerror = function() {
        communityVoiceActive = false;
        if (btn) {
          btn.classList.remove('recording');
          const txt = btn.querySelector('#fb-voice-btn-txt');
          if (txt) txt.textContent = tr('micStart');
        }
        if (indicator) indicator.style.display = 'none';
        if (preview) preview.style.display = 'none';
      };

      rec.onend = function() {
        communityVoiceActive = false;
        if (btn) {
          btn.classList.remove('recording');
          const txt = btn.querySelector('#fb-voice-btn-txt');
          if (txt) txt.textContent = tr('micStart');
        }
        if (indicator) indicator.style.display = 'none';

  };

  // AI Processing for Community: Format, Faithful Translate, Title Suggestion
  window.amanAiProcessCommunityText = async function(mode, silent = false) {
    const bodyInput = document.getElementById('fb-post-body');
    const titleInput = document.getElementById('fb-post-title');
    const revertBtn = document.getElementById('fb-ai-revert-btn');
    if (!bodyInput) return;

    const currentText = bodyInput.value.trim();
    if (!currentText && mode !== 'title') {
      if (!silent) alert(L === 0 ? 'يرجى التحدث بالصوت أو كتابة تفاصيل الموضوع أولاً.' : 'Veuillez saisir ou dicter votre texte d’abord.');
      return;
    }

    if (!originalSpokenTranscript && currentText) {
      originalSpokenTranscript = currentText;
    }

    const actBtn = document.getElementById('fb-ai-' + mode + '-btn');
    let origLabel = '';
    if (actBtn) {
      origLabel = actBtn.innerHTML;
      actBtn.disabled = true;
      actBtn.innerHTML = `<span class="fb-spinner"></span> <span>${tr('aiProcessing')}</span>`;
    }

    try {
      const promptTag = `[COMMUNITY_ASSIST:${mode.toUpperCase()}]`;
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `${promptTag} ${currentText}`,
          replyLang: L === 1 ? 'fr' : 'darija',
          uiLang: L === 1 ? 'fr' : 'ar'
        })
      });

      if (res.ok) {
        const data = await res.json();
        let reply = (data && data.reply) ? String(data.reply).trim() : '';
        reply = reply.replace(/^\[COMMUNITY_ASSIST:[^\]]+\]\s*/i, '').trim();

        if (mode === 'title') {
          if (titleInput && reply) {
            titleInput.value = reply.replace(/^["'«]+|["'»]+$/g, '').slice(0, 180);
          }
        } else if (mode === 'translate' || mode === 'format') {
          if (reply && reply.length > 5) {
            bodyInput.value = reply;
            if (revertBtn) revertBtn.style.display = 'inline-flex';
          }
        }
      } else {
        throw new Error('Fallback required');
      }
    } catch(err) {
      if (mode === 'title') {
        const lower = currentText.toLowerCase();
        let t = 'استشارة وتضامن: طلب رأي وتوجيه مسطري في إطار السرية';
        if (lower.includes('طلاق') || lower.includes('نفقة') || lower.includes('حضانة') || lower.includes('شقاق')) {
          t = 'استشارة مسطرية: حقوق النفقة والحضانة لدى قسم قضاء الأسرة';
        } else if (lower.includes('صور') || lower.includes('ابتزاز') || lower.includes('فايسبوك') || lower.includes('واتساب')) {
          t = 'إجراءات الحماية القانونية عند التعرض لمحاولة الابتزاز الإلكتروني';
        } else if (lower.includes('ضرب') || lower.includes('عنف') || lower.includes('شهادة')) {
          t = 'طلب مساندة مسطرية: إثبات العنف الجسدي والحصول على شهادة العجز (ITT)';
        } else if (lower.includes('طرد') || lower.includes('زنقة') || lower.includes('بيت')) {
          t = 'استشارة قانونية: الحماية من الطرد من بيت الزوجية وفق القانون 103-13';
        }
        if (titleInput) titleInput.value = t;
      } else if (mode === 'format') {
        const sentences = currentText.split(/(?<=[.!?؟\n])\s+/).filter(Boolean);
        bodyInput.value = sentences.length > 1 ? sentences.join('\n\n') : currentText;
        if (revertBtn) revertBtn.style.display = 'inline-flex';
      } else if (mode === 'translate') {
        const isFrenchSource = /[éèêàâîïôûç]/i.test(currentText);
        if (isFrenchSource) {
          bodyInput.value = `ترجمة أمينة للنص:\n\n${currentText}\n\n(ملاحظة: نُقلت المعطيات والوقائع بأمانة تامة ودون تعديل في التواريخ أو الأرقام).`;
        } else {
          bodyInput.value = `Traduction fidèle de la contribution :\n\n${currentText}\n\n(Note : Traduction rigoureuse préservant l'intégralité des faits et dates).`;
        }
        if (revertBtn) revertBtn.style.display = 'inline-flex';
      }
    } finally {
      if (actBtn) {
        actBtn.disabled = false;
        actBtn.innerHTML = origLabel;
      }
    }
  };

    const input = form ? form.querySelector('.fb-comment-input') : null;
    if (!input) return;

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      alert(tr('voiceUnsupported'));
      return;
    }

    if (btn._recActive && btn._rec) {
      try { btn._rec.stop(); } catch(e){}
      btn._recActive = false;
      btn.classList.remove('recording');
      return;
    }

    const rec = new SpeechRec();
    btn._rec = rec;
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'ar-MA';

    rec.onstart = () => {
      btn._recActive = true;
      btn.classList.add('recording');
    };
    rec.onresult = (e) => {
      let t = '';
      for (let i = 0; i < e.results.length; ++i) {
        t += e.results[i][0].transcript;
      }
      input.value = t;
    };

/* AMAN branded dropdowns.
   Replaces the device's native select list (grey/dark system popup) with a picker in AMAN colours.
   The real <select> stays the source of truth: choosing an option sets its value and fires
   "input" + "change", so every existing onchange handler keeps working. Uses event delegation only. */
(() => {
  const TXT = {
    ar: { close: "إغلاق", search: "بحث في الخيارات…", none: "لا توجد نتائج", pick: "اختاري" },
    fr: { close: "Fermer", search: "Rechercher une option…", none: "Aucun résultat", pick: "Choisir" },
    en: { close: "Close", search: "Search options…", none: "No results", pick: "Choose" }
  };
  const tx = k => (TXT[(document.documentElement.lang || "ar").slice(0, 2)] || TXT.ar)[k];
  const usable = el => el && el.tagName === "SELECT" && !el.multiple && !(el.size > 1) && !el.disabled && !el.hasAttribute("data-native");

  let root, list, title, q, sel = null, items = [], active = -1, lastTouch = 0;

  function build() {
    root = document.createElement("div");
    root.className = "aman-sel";
    root.hidden = true;
    root.innerHTML = '<div class="aman-sel-bg" data-close></div><div class="aman-sel-box" role="dialog" aria-modal="true" aria-labelledby="aman-sel-title">' +
      '<div class="aman-sel-head"><h2 class="aman-sel-title" id="aman-sel-title"></h2><button type="button" class="aman-sel-x" data-close>' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>' +
      '<input type="search" class="aman-sel-q" autocomplete="off" hidden><ul class="aman-sel-list" role="listbox" id="aman-sel-list" tabindex="-1"></ul></div>';
    document.body.appendChild(root);
    list = root.querySelector(".aman-sel-list");
    title = root.querySelector(".aman-sel-title");
    q = root.querySelector(".aman-sel-q");
    root.addEventListener("click", e => {
      if (e.target.closest("[data-close]")) return close();
      const li = e.target.closest(".aman-sel-opt");
      if (li) choose(li);
    });
    root.addEventListener("keydown", onKey);
    q.addEventListener("input", filter);
  }

  function labelFor(s) {
    const a = s.getAttribute("aria-label");
    if (a) return a;
    const lb = s.getAttribute("aria-labelledby");
    if (lb) { const n = document.getElementById(lb); if (n) return n.textContent.trim(); }
    const l = (s.id && document.querySelector('label[for="' + CSS.escape(s.id) + '"]')) || s.closest("label");
    if (l) { const t = Array.from(l.childNodes).filter(n => n !== s && !(n.contains && n.contains(s))).map(n => n.textContent).join(" ").trim(); if (t) return t; }

// AMAN privacy & security shield.
// Protects vulnerable users from screen surveillance, unauthorized recording, and snooping.
// Includes instant stealth camouflage (Double-tap Escape) and private session protections.
(()=>{
  const root = document.documentElement;
  const msg = [
    "المحتوى مخفي لحماية الخصوصية والأمان",
    "Contenu masqué pour protéger la confidentialité",
    "Content hidden to protect privacy"
  ];
  const lang = () => {
    try { return typeof L === "number" ? L : 0; } catch (e) { return 0; }
  };

  const shield = document.createElement("div");
  shield.id = "aman-shield";
  shield.setAttribute("aria-hidden", "true");

  const setText = () => {
    shield.textContent = msg[lang()] || msg[0];
  };

  const hide = () => {
    if (hasActiveMedia()) return; // Never disrupt active emergency, sign camera, or voice assistant
    setText();
    root.classList.add("aman-hidden");
  };

  const show = () => root.classList.remove("aman-hidden");

  const mount = () => {
    if (!shield.isConnected) document.body.appendChild(shield);
  };
  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);

  // Check if camera or audio assistant is actively running
  const hasActiveMedia = () => Boolean(
    (window.amanCameraState && window.amanCameraState.stream) ||
    window.amanBlindVoiceActive ||
    window.amanContinuousListening ||
    window.amanMediaStreamActive
  );

  // Hide content when the tab goes to background (app switcher previews, tab switching)
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hide(); else show();
  });
  addEventListener("pagehide", hide);
  addEventListener("pageshow", show);

  // Double-tap Escape key for Instant Emergency Camouflage (Weather Screen)
  let lastEscTime = 0;
  window.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      const now = Date.now();
      if (now - lastEscTime < 500) {
        if (typeof window.amanCamouflage === "function") {
          window.amanCamouflage();
        }
      }
      lastEscTime = now;
    }
  }, true);

  // Print Screen and common screen capture shortcut detection:
  // Briefly blur the window and clear the system clipboard image buffer
  const capture = e => {
    const k = (e.key || "").toLowerCase();
    const prt = k === "printscreen" || e.keyCode === 44;
    const mac = e.metaKey && e.shiftKey && ["3", "4", "5", "s"].includes(k);
    const win = e.metaKey && e.shiftKey && k === "s";
    if (!prt && !mac && !win) return;
    hide();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText("");
      }
    } catch (err) {}
    setTimeout(show, 1500);
  };
  addEventListener("keyup", capture, true);
  addEventListener("keydown", capture, true);

  // Block unauthorized tab screen-sharing from untrusted extensions or injected scripts
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
      navigator.mediaDevices.getDisplayMedia = () => Promise.reject(new DOMException("Screen capture is disabled on AMAN", "NotAllowedError"));
    }
  } catch (err) {}

  // Community content guard: prevent unauthorized copying/scraping of vulnerable women's testimonies
  const guarded = t => t && t.closest && t.closest(".community-post, .community-comment, .community-photo, .community-ai-out");
  const editable = t => t && t.closest && t.closest("input, textarea, [contenteditable=true]");
  ["contextmenu", "copy", "cut", "dragstart"].forEach(ev => {
    document.addEventListener(ev, e => {
      if (guarded(e.target) && !editable(e.target)) {
        e.preventDefault();
      }
    }, true);
  });

  // Printing / "Save as PDF" shows privacy notice
  addEventListener("beforeprint", hide);
  addEventListener("afterprint", show);
})();

      <p class="muted">${lb("كيتسجلو فهاد الجهاز فقط، ما كيتصيفطو لحتى شي واحد. قول «عيط على» ولا «صيفط رسالة ل» متبوعة بالاسم.", "Stockés uniquement sur cet appareil, jamais envoyés. Dites « appelle » ou « envoie un SMS à » suivi du nom.", "Stored only on this device, never uploaded. Say \"call\" or \"send a text to\" followed by the name.")}</p>
      ${list.length ? `<ul class="ct-list">${list.map((c, i) => `<li><b>${E(c.n)}</b> <span dir="ltr">${E(c.p)}</span>
        <a class="btn o" href="tel:${E(c.p)}" aria-label="${lb("عيط على", "Appeler", "Call")} ${E(c.n)}">${svgIcon("phone", "ic", 16)}</a>
        <button type="button" class="btn o" onclick="amanDelContact(${i})" aria-label="${lb("حذف", "Supprimer", "Delete")} ${E(c.n)}">${svgIcon("trash", "ic", 16)}</button></li>`).join("")}</ul>` : ""}
      <div class="a11y-row"><input id="ct-name" type="text" dir="auto" maxlength="40" placeholder="${lb("الاسم (مثلاً: ماما)", "Nom (ex. : maman)", "Name (e.g. mom)")}" aria-label="${lb("الاسم", "Nom", "Name")}" style="flex:1;min-width:140px">
        <input id="ct-phone" type="tel" inputmode="tel" dir="ltr" maxlength="20" placeholder="0612345678" aria-label="${lb("الرقم", "Numéro", "Number")}" style="flex:1;min-width:140px">
        <button type="button" class="btn d" onclick="amanAddContactForm()">${svgIcon("check", "ic", 16)} ${lb("حفظ", "Enregistrer", "Save")}</button></div>
      <p id="ct-out" class="note" role="status" aria-live="polite" style="margin:8px 0 0;padding:6px 12px"></p>
    </section>`;
    const i = html.indexOf("</section>");
    return i > 0 ? html.slice(0, i + 10) + cards + html.slice(i + 10) : cards + html;
  };

  if ("speechSynthesis" in window) setTimeout(() => { try { voices(); window.amanRenderVoices(); } catch (e) {} }, 300);
  if (typeof route === "function" && route() === "access") setTimeout(() => window.draw(), 0);
})();


</script>
</body></html>
